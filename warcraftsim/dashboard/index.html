<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warcraftsim training</title>
<style>
:root { --bg:#0f1318; --panel:#171d24; --panel2:#1d252e; --line:#2a3440; --text:#d7dee6; --muted:#8795a3;
        --accent:#e0a33a; --good:#4cc38a; --bad:#e5534b; --blue:#539bf5; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line); background:#12171d; }
header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
header h1 span { color:var(--accent); }
header .sub { color:var(--muted); }
header .right { margin-left:auto; color:var(--muted); display:flex; gap:10px; align-items:center; }
.layout { display:grid; grid-template-columns:270px 1fr; min-height:calc(100vh - 45px); }
aside { border-right:1px solid var(--line); padding:10px; background:#12171d; overflow:auto; }
aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:6px 4px 8px; }
.run { padding:8px 9px; border-radius:6px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
.run:hover { background:var(--panel); }
.run.sel { background:var(--panel2); border-color:var(--line); }
.run .n { font-weight:600; display:flex; justify-content:space-between; gap:6px; align-items:center; }
.run .m { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; margin-top:2px; }
.run input { margin:0 6px 0 0; accent-color:var(--accent); }
.badge { font-size:10px; padding:1px 6px; border-radius:9px; background:#2d3743; color:var(--muted); white-space:nowrap; }
.badge.training { background:#1e3a2c; color:var(--good); }
.badge.failed { background:#3d1f1f; color:var(--bad); }
.badge.finished { background:#1f2e44; color:var(--blue); }
main { padding:14px 18px 40px; overflow:auto; }
.title { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.title h2 { margin:0; font-size:18px; }
.title .desc { color:var(--muted); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.card .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
.card .v { font-size:20px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
.card .v small { font-size:12px; color:var(--muted); font-weight:400; }
.progress { height:4px; background:#26303b; border-radius:2px; margin-top:6px; overflow:hidden; }
.progress div { height:100%; background:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:12px; }
.chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px 6px; position:relative; }
.chart h3 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; }
.chart .plot { position:relative; }
.chart canvas { width:100%; height:210px; display:block; }
.chart canvas.overlay { position:absolute; left:0; top:0; pointer-events:none; }
.legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:2px 0 10px; color:var(--muted); font-size:12px; }
.legend svg { vertical-align:middle; margin-right:5px; }
.smooth { display:flex; align-items:center; gap:6px; }
.smooth input { width:120px; accent-color:var(--accent); }
.tip { position:absolute; pointer-events:none; background:#0b0f13d9; border:1px solid var(--line); border-radius:6px; padding:4px 7px;
       font-size:11px; line-height:1.35; white-space:nowrap; display:none; z-index:5; }
.tip.hovered { background:#0b0f13f2; border-color:#4a5868; }
section { margin-top:18px; }
section > h3 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
.media { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.item { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.item video, .item iframe { width:100%; aspect-ratio:16/10; border:0; display:block; background:#000; }
.item.wide { grid-column:span 2; }
.item.wide video { aspect-ratio:auto; }
@media (max-width: 900px) { .item.wide { grid-column:span 1; } }
.grid h4 { grid-column:1/-1; margin:8px 0 -4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
.item .cap { padding:6px 10px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.item .cap a { color:var(--blue); text-decoration:none; }
.win { color:var(--good); } .loss { color:var(--bad); }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
th, td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.empty { color:var(--muted); padding:30px; text-align:center; }
pre.cmd { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--muted); white-space:pre-wrap; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>warcraft<span>sim</span></h1><span class="sub">Warcraft III 1.29 · PufferLib 5.0 training dashboard</span>
  <div class="right"><label class="smooth" title="exponential moving average over the points of every chart">smoothing
    <input type="range" id="smooth" min="0" max="0.99" step="0.01"><span id="smoothv"></span></label>
    <span id="clock"></span><label><input type="checkbox" id="auto" checked> auto-refresh</label></div>
</header>
<div class="layout">
  <aside><h2>Runs <span style="float:right;text-transform:none;letter-spacing:0">☑ compare</span></h2><div id="runs"></div></aside>
  <main id="main"><div class="empty">No runs yet. Start one with <code>python -m warcraftsim.puffer.train --task micro</code>.</div></main>
</div>
<script>
const COLORS = ["#e0a33a", "#539bf5", "#4cc38a", "#e5534b", "#b083f0", "#39c5cf", "#f47067", "#c69026"];
const DASHES = [[], [7, 4], [2, 3], [10, 3, 2, 3], [14, 5], [4, 2, 1, 2]];  // line style per compared run
let state = { runs: [], selected: null, compare: new Set(), data: {}, mediaKey: "" };
const ui = { smooth: 0.6, hoverX: null, hoverChart: null, charts: {} };
try { const v = parseFloat(localStorage.getItem("smooth")); if (!Number.isNaN(v)) ui.smooth = v; } catch (e) {}
// shareable view: #run=NAME&compare=A,B&smooth=0.8
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("run")) state.selected = h.get("run");
  if (h.get("compare")) h.get("compare").split(",").filter(Boolean).forEach(n => state.compare.add(n));
  if (h.get("smooth") !== null && !Number.isNaN(parseFloat(h.get("smooth")))) ui.smooth = parseFloat(h.get("smooth"));
  if (h.get("hover")) ui.hoverX = parseFloat(h.get("hover"));  // a cursor position (screenshots)
})();
function saveHash() {
  const h = new URLSearchParams();
  if (state.selected) h.set("run", state.selected);
  if (state.compare.size) h.set("compare", [...state.compare].join(","));
  history.replaceState(null, "", "#" + h.toString());
}

function fmt(v, d = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "K";
  if (a >= 100) return v.toFixed(0);
  if (a > 0 && a < 0.01) return v.toExponential(1);
  return v.toFixed(d);
}
function ago(t) {
  if (!t) return "–";
  const s = Date.now() / 1000 - t;
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return (s / 3600).toFixed(1) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function dur(s) {
  if (!s || s < 0) return "–";
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
}
function badge(status) {
  const cls = status === "training" ? "training" : status.startsWith("failed") ? "failed" : status === "finished" ? "finished" : "";
  return `<span class="badge ${cls}">${status}</span>`;
}
function dashSvg(dash, color = "#d7dee6") {
  return `<svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="${color}" stroke-width="2" stroke-dasharray="${dash.join(",")}"/></svg>`;
}
// TensorBoard-style debiased exponential moving average
function smooth(points, a) {
  if (!(a > 0) || points.length < 3) return points;
  let last = 0, w = 0;
  return points.map(([x, y]) => { last = last * a + (1 - a) * y; w = w * a + (1 - a); return [x, last / w]; });
}

// ---- charts: base canvas + overlay canvas (crosshair shared by all charts) -------------------
function drawChart(id) {
  const c = ui.charts[id]; if (!c) return;
  const canvas = c.canvas, dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  c.overlay.width = W * dpr; c.overlay.height = H * dpr; c.overlay.style.width = W + "px"; c.overlay.style.height = H + "px";
  const g = canvas.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const pad = { l: 46, r: 10, t: 8, b: 22 };
  const series = c.series.map(s => ({ ...s, pts: s.dots || s.raw ? s.points : smooth(s.points, ui.smooth) }));
  const pts = series.flatMap(s => s.pts);
  c.geo = null;
  if (!pts.length) { g.fillStyle = "#8795a3"; g.font = "11px system-ui"; g.fillText(c.opts.empty || "no data yet", 12, H / 2); return; }
  // one x range for all charts (0 .. latest step of the shown runs), so they line up
  let x0 = ui.xrange ? ui.xrange[0] : Math.min(...pts.map(p => p[0]));
  let x1 = ui.xrange ? ui.xrange[1] : Math.max(...pts.map(p => p[0]));
  // y range without the most extreme 0.5% on either side (a partial last epoch reports huge SPS)
  const ys = pts.map(p => p[1]).sort((a, b) => a - b), q = k => ys[Math.min(ys.length - 1, Math.max(0, Math.round(k * (ys.length - 1))))];
  let y0 = c.opts.ymin ?? (ys.length > 50 ? q(0.005) : ys[0]), y1 = c.opts.ymax ?? (ys.length > 50 ? q(0.995) : ys[ys.length - 1]);
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) { y1 += 1; y0 -= c.opts.ymin !== undefined ? 0 : 1; }
  const yr = y1 - y0; if (c.opts.ymin === undefined) y0 -= yr * 0.05; if (c.opts.ymax === undefined) y1 += yr * 0.05;
  const X = x => pad.l + (x - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const Yraw = y => H - pad.b - (y - y0) / (y1 - y0) * (H - pad.t - pad.b);
  const Y = y => Math.max(pad.t - 2, Math.min(H - pad.b + 2, Yraw(y)));  // clip outliers to the frame
  g.font = "10px system-ui"; g.strokeStyle = "#2a3440"; g.fillStyle = "#8795a3"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = y0 + (y1 - y0) * i / 4, py = Math.round(Y(y)) + .5;
    g.beginPath(); g.moveTo(pad.l, py); g.lineTo(W - pad.r, py); g.stroke();
    g.fillText(fmt(y), 4, py + 3);
  }
  for (let i = 0; i <= 4; i++) {
    const x = x0 + (x1 - x0) * i / 4;
    g.fillText(fmt(x, 0), Math.min(X(x) - 12, W - 40), H - 6);
  }
  for (const s of series) {
    if (!s.pts.length) continue;
    g.strokeStyle = g.fillStyle = s.color; g.lineWidth = s.run === 0 ? 1.8 : 1.5; g.setLineDash(s.dash || []);
    if (s.dots) {
      for (const p of s.pts) { g.beginPath(); g.arc(X(p[0]), Y(p[1]), 3, 0, 7); s.run === 0 ? g.fill() : g.stroke(); }
    } else {
      if (ui.smooth > 0 && s.points.length > 2) {  // the raw points, faint, under the smoothed line
        g.globalAlpha = 0.18; g.beginPath();
        s.points.forEach((p, j) => j ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke(); g.globalAlpha = 1;
      }
      g.beginPath(); s.pts.forEach((p, j) => j ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke();
    }
    g.setLineDash([]);
  }
  c.geo = { series, X, Y, x0, x1, pad, W, H };
  drawCrosshair(id);
}

function nearest(pts, x) {
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m][0] < x) lo = m; else hi = m; }
  return Math.abs(pts[lo][0] - x) <= Math.abs(pts[hi][0] - x) ? pts[lo] : pts[hi];
}

function drawCrosshair(id) {
  const c = ui.charts[id]; if (!c) return;
  const dpr = window.devicePixelRatio || 1, g = c.overlay.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, c.overlay.width, c.overlay.height);
  const geo = c.geo, x = ui.hoverX;
  if (!geo || x === null || x < geo.x0 || x > geo.x1) { c.tip.style.display = "none"; return; }
  const px = Math.round(geo.X(x)) + .5;
  g.strokeStyle = "rgba(215,222,230,.55)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, geo.pad.t); g.lineTo(px, geo.H - geo.pad.b); g.stroke();
  const rows = [];
  for (const s of geo.series) {
    if (!s.pts.length) continue;
    const p = nearest(s.pts, x);
    g.fillStyle = s.color; g.beginPath(); g.arc(geo.X(p[0]), geo.Y(p[1]), 2.6, 0, 7); g.fill();
    rows.push(`<div>${dashSvg(s.dash || [], s.color)}${s.name}${s.runName ? ` <span style="color:#8795a3">${s.runName}</span>` : ""}: <b>${fmt(p[1], 3)}</b></div>`);
  }
  if (rows.length) {  // every chart shows its values at the hovered step
    c.tip.innerHTML = `<div style="color:#8795a3">steps ${fmt(x, 0)}</div>` + rows.join("");
    c.tip.style.display = "block";
    c.tip.classList.toggle("hovered", ui.hoverChart === id);
    const w = c.tip.offsetWidth || 200;
    const left = px + 12 + w > geo.W ? px - 12 - w : px + 12;  // beside the line, inside the chart
    c.tip.style.left = Math.max(0, left) + "px"; c.tip.style.top = "6px";
  } else c.tip.style.display = "none";
}

function drawAllCrosshairs() { for (const id in ui.charts) drawCrosshair(id); }

function registerChart(id, opts) {
  const canvas = document.getElementById(id), overlay = document.getElementById(id + "-ov"), tip = document.getElementById(id + "-tip");
  ui.charts[id] = { canvas, overlay, tip, opts, series: [], geo: null };
  canvas.addEventListener("mousemove", ev => {
    const geo = ui.charts[id].geo; if (!geo) return;
    const r = canvas.getBoundingClientRect(), mx = ev.clientX - r.left;
    ui.hoverX = geo.x0 + (mx - geo.pad.l) / (geo.W - geo.pad.l - geo.pad.r) * (geo.x1 - geo.x0);
    ui.hoverChart = id; drawAllCrosshairs();
  });
  canvas.addEventListener("mouseleave", () => { ui.hoverX = null; ui.hoverChart = null; drawAllCrosshairs(); });
}

// ---- data --------------------------------------------------------------------------------------
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

async function refresh() {
  try {
    state.runs = await getJSON("/api/runs");
    if (!state.selected && state.runs.length) state.selected = state.runs[0].name;
    renderRuns();
    const names = new Set([state.selected, ...state.compare].filter(Boolean));
    for (const n of names) state.data[n] = await getJSON("/api/runs/" + encodeURIComponent(n));
    if (state.selected) renderMain();
  } catch (e) { console.error(e); }
  document.getElementById("clock").textContent = "updated " + new Date().toLocaleTimeString();
}

function renderRuns() {
  document.getElementById("runs").innerHTML = state.runs.map(r => {
    const s = r.summary || {};
    const wr = s.win_rate_100 === null || s.win_rate_100 === undefined ? "–" : (100 * s.win_rate_100).toFixed(0) + "%";
    return `<div class="run ${r.name === state.selected ? "sel" : ""}" data-run="${r.name}">
      <div class="n"><span><input type="checkbox" data-cmp="${r.name}" ${state.compare.has(r.name) ? "checked" : ""}>${r.name}</span>${badge(r.status)}</div>
      <div class="m"><span>${r.task} · ${r.envs} games</span><span>win ${wr}</span></div>
      <div class="m"><span>${fmt(s.agent_steps || 0, 0)} steps</span><span>${ago(s.updated)}</span></div>${r.sweep ? `
      <div class="m" title="sweep ${r.sweep.group}"><span style="color:var(--accent)">sweep ${r.sweep.index}/${r.sweep.of}</span><span>${r.sweep.options || "base"}</span></div>` : ""}</div>`;
  }).join("") || `<div class="empty">no runs</div>`;
  document.querySelectorAll(".run").forEach(el => el.onclick = ev => {
    if (ev.target.dataset.cmp) return;
    state.selected = el.dataset.run; state.mediaKey = ""; saveHash(); refresh();
  });
  document.querySelectorAll("[data-cmp]").forEach(el => el.onchange = () => {
    el.checked ? state.compare.add(el.dataset.cmp) : state.compare.delete(el.dataset.cmp); saveHash(); refresh();
  });
}

// Every chart: series = [source, key, name, color, transform?]; sources: ep (episodes), tr (trainer
// epochs), br (bridge throughput), cal (value calibration, dots)
const EP = (key, name, color) => ["ep", key, name, color];
const TR = (key, name, color, f) => ["tr", key, name, color, f];
const SECTIONS = [
  ["Outcomes", [
    ["c-win", "Win rate", "vs env steps", [EP("win_rate", "win rate", "#4cc38a")], { ymin: 0, ymax: 1 }],
    ["c-out", "Outcomes", "win · draw (time limit) · loss",
      [EP("win_rate", "win", "#4cc38a"), EP("draw_rate", "draw", "#e0a33a"), EP("loss_rate", "loss", "#e5534b")], { ymin: 0, ymax: 1 }],
    ["c-ret", "Episode return", "", [EP("return", "return", "#e0a33a")], {}],
    ["c-len", "Episode length", "game seconds", [EP("game_time", "game seconds", "#539bf5")], {}],
  ]],
  ["Behaviour", [
    ["c-act", "Action mix", "share of unit-steps", [EP("act_noop", "noop", "#8795a3"), EP("act_stop", "stop", "#e0c33a"),
      EP("act_retreat", "retreat", "#b083f0"), EP("act_move", "move", "#539bf5"), EP("act_cast", "cast", "#f56ed2"), EP("act_attack", "attack", "#e5534b")], { ymin: 0, ymax: 1, empty: "no action statistics for this task/run" }],
    ["c-tgt", "Targeting", "damage concentration: share hitting one unit per step",
      [EP("combat_focus_dealt", "damage dealt on one enemy", "#e0a33a"), EP("combat_focus_taken", "damage taken on one unit", "#e5534b"),
       EP("act_attack_weakest", "attack orders on the weakest", "#4cc38a"), EP("act_attack_invalid", "invalid attack orders", "#8795a3"),
       EP("act_cast_invalid", "casts not possible", "#f56ed2")],
      { ymin: 0, ymax: 1, empty: "no combat statistics yet" }],
    ["c-cmb", "Combat", "per episode, agent side", [EP("combat_dealt", "damage dealt (share of enemy HP)", "#4cc38a"),
      EP("combat_taken", "damage taken (share of own HP)", "#e5534b")], { ymin: 0, ymax: 1, empty: "no combat statistics yet" }],
    ["c-kill", "Kills · losses", "units per episode", [EP("combat_kills", "kills", "#4cc38a"), EP("combat_losses", "losses", "#e5534b")],
      { ymin: 0, empty: "no combat statistics yet" }],
  ]],
  ["Learning", [
    ["c-val", "Value calibration", "video episodes: V(s₀) vs discounted return",
      [["cal", "value0", "predicted V(s₀)", "#e0a33a"], ["cal", "return0", "actual discounted return", "#539bf5"]],
      { empty: "appears with the first replay video rendered after a checkpoint" }],
    ["c-lpol", "Policy loss", "", [TR("loss/policy", "policy loss", "#e0a33a")], {}],
    ["c-lval", "Value loss", "", [TR("loss/value", "value loss", "#539bf5")], {}],
    ["c-lent", "Entropy", "sum over action heads", [TR("loss/entropy", "entropy", "#b083f0")], {}],
    ["c-lkl", "Approx. KL", "per update", [TR("loss/kl", "kl", "#4cc38a")], { ymin: 0 }],
    ["c-lclip", "Clip fraction", "", [TR("loss/clipfrac", "clip fraction", "#39c5cf")], { ymin: 0 }],
  ]],
  ["System", [
    ["c-sps", "Throughput", "trainer SPS · game time vs real time",
      [TR("SPS", "trainer SPS", "#e0a33a"), ["br", "game_x_realtime", "game × realtime", "#4cc38a"]], { ymin: 0 }],
    ["c-perf", "Trainer time per epoch", "seconds", [TR("perf/rollout", "rollout", "#e0a33a"),
      TR("perf/eval_env", "waiting for games", "#e5534b"), TR("perf/eval_model", "model forward", "#539bf5"),
      TR("perf/train", "PPO update", "#4cc38a")], { ymin: 0 }],
  ]],
];

function seriesPoints(d, src, key) {
  const o = d.info.init_steps || 0;  // a run continued from a checkpoint starts where its parent was
  if (src === "ep") return d.episodes.filter(e => e[key] !== undefined).map(e => [o + e.steps, e[key]]);
  if (src === "tr") return d.train.filter(r => r[key] !== undefined).map(r => [o + (r.agent_steps ?? r.steps), r[key]]);
  if (src === "br") return d.bridge.map(b => [o + b.steps, b[key]]);
  if (src === "cal") return d.calibration.map(c => [o + c.steps, c[key]]);
  return [];
}

function renderMain() {
  const d = state.data[state.selected]; if (!d) return;
  const info = d.info, tr = d.train, last = tr[tr.length - 1] || {};
  const run = state.runs.find(r => r.name === state.selected) || {}, s = run.summary || {};
  const bridge = d.bridge[d.bridge.length - 1] || {};
  const elapsed = (info.finished || Date.now() / 1000) - (info.started || info.created);
  const progress = Math.min(1, (last.agent_steps || 0) / info.timesteps);
  const main = document.getElementById("main");
  if (main.dataset.run !== state.selected) {
    main.dataset.run = state.selected;
    ui.charts = {};
    const box = ([id, title, sub]) => `<div class="chart"><h3>${title}<span>${sub}</span></h3><div class="plot"><canvas id="${id}"></canvas><canvas class="overlay" id="${id}-ov"></canvas><div class="tip" id="${id}-tip"></div></div></div>`;
    main.innerHTML = `
      <div class="title"><h2>${info.name}</h2>${badge(info.status)}<span class="desc">${info.description || ""}</span>${info.sweep ? `<span class="desc" style="color:var(--accent)">sweep ${info.sweep.group} ${info.sweep.index}/${info.sweep.of}: ${info.sweep.options || "base options"}</span>` : ""}</div>
      <div class="cards" id="cards"></div>
      <div class="legend" id="legend"></div>
      <div class="grid">${SECTIONS.map(([name, charts]) => `<h4>${name}</h4>` + charts.map(box).join("")).join("")}</div>
      <section><h3>Replays &amp; renders</h3><div class="media" id="media"></div></section>
      <section><h3>Recent episodes</h3><div id="episodes"></div></section>
      <section><h3>Run</h3><pre class="cmd" id="cmd"></pre></section>`;
    for (const [, charts] of SECTIONS) for (const [id, , , , opts] of charts) registerChart(id, opts);
  }
  document.getElementById("cards").innerHTML = [
    ["Status", `${info.status}`, `<div class="progress"><div style="width:${(100 * progress).toFixed(1)}%"></div></div>`],
    ["Env steps", `${fmt(last.agent_steps || 0, 0)} <small>/ ${fmt(info.timesteps, 0)}</small>`],
    ["Win rate", s.win_rate_100 === null || s.win_rate_100 === undefined ? "–" : `${(100 * s.win_rate_100).toFixed(1)}% <small>last 100</small>`],
    ["Return", `${fmt(s.return_100, 3)} <small>last 100</small>`],
    ["Episodes", fmt(s.episodes || 0, 0)],
    ["Trainer SPS", fmt(last.SPS || 0, 0)],
    ["Game speed", bridge.game_x_realtime ? `${fmt(bridge.game_x_realtime, 0)}× <small>realtime, all games</small>` : "–"],
    ["Games", `${info.envs}`],
    ["Elapsed", dur(elapsed)],
    ["GPU", last["util/gpu_percent"] !== undefined ? `${fmt(last["util/gpu_percent"], 0)}% <small>${fmt(last["util/vram_used_gb"], 1)} GB</small>` : "–"],
  ].map(([k, v, x = ""]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${x}</div>`).join("");

  // runs shown: the selected one (solid) and the compared ones (other line styles)
  const shown = [state.selected, ...[...state.compare].filter(n => n !== state.selected && state.data[n])];
  const off = n => state.data[n].info.init_steps || 0;
  const maxStep = Math.max(1, ...shown.map(n => { const t = state.data[n].train; return off(n) + (t.length ? (t[t.length - 1].agent_steps ?? 0) : 0); }),
                           ...shown.map(n => { const e = state.data[n].episodes; return off(n) + (e.length ? e[e.length - 1].steps : 0); }));
  ui.xrange = [0, maxStep];
  document.getElementById("legend").innerHTML = shown.length > 1
    ? shown.map((n, i) => `<span>${dashSvg(DASHES[i % DASHES.length])}${n}${state.data[n]?.info?.sweep ? ` <span style="color:var(--accent)">${state.data[n].info.sweep.options}</span>` : ""}</span>`).join("")
    : "";
  for (const [, charts] of SECTIONS) {
    for (const [id, , , defs] of charts) {
      const c = ui.charts[id]; if (!c) continue;
      c.series = [];
      shown.forEach((n, ri) => {
        for (const [src, key, name, color] of defs) {
          c.series.push({ name, color, run: ri, runName: shown.length > 1 ? n : "", dash: DASHES[ri % DASHES.length],
                          dots: src === "cal", points: seriesPoints(state.data[n], src, key) });
        }
      });
      drawChart(id);
    }
  }

  const key = d.media.map(m => m.file).join("|");
  if (key !== state.mediaKey) {  // only rebuild the gallery when it changed (keeps videos playing)
    state.mediaKey = key;
    const videos = d.media.filter(m => m.kind === "video").slice(0, 6);
    const renders = d.media.filter(m => m.kind === "render").slice(0, 6);
    const cap = m => `<div class="cap"><span>episode ${m.episode} · <span class="${m.outcome > 0 ? "win" : m.outcome < 0 ? "loss" : ""}">${m.outcome > 0 ? "win" : m.outcome < 0 ? "loss" : "tie"}</span> · return ${fmt(m.return, 2)}</span><a href="/files/${state.selected}/${m.file}" target="_blank">open ↗</a></div>`;
    document.getElementById("media").innerHTML =
      videos.map(m => `<div class="item wide"><video src="/files/${state.selected}/${m.file}" controls muted loop preload="metadata"></video>${cap(m)}</div>`).join("") +
      renders.map(m => `<div class="item"><iframe src="/files/${state.selected}/${m.file}" loading="lazy"></iframe>${cap(m)}</div>`).join("") ||
      `<div class="empty">No replays yet: trajectory renders appear every few episodes, game videos every ${info.args?.video_every || "N"} episodes of game 0.</div>`;
  }
  const pct = v => v === undefined ? "–" : (100 * v).toFixed(0) + "%";
  const mix = a => a ? ["noop", "stop", "retreat", "move", "attack", "cast"].filter(k => a[k] !== undefined).map(k => `${k} ${pct(a[k])}`).join(" · ") : "–";
  document.getElementById("episodes").innerHTML = d.recent_episodes.length ? `<table><tr><th>#</th><th>game</th><th>outcome</th><th>return</th><th>length</th><th>game time</th><th>dealt / taken</th><th>kills / losses</th><th>actions</th><th>focus dealt / taken</th><th>when</th></tr>` +
    d.recent_episodes.map(e => { const c = e.combat || {};
      return `<tr><td>${e.episode}</td><td>${e.env}</td><td class="${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : ""}">${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : "draw"}</td><td>${fmt(e.return, 3)}</td><td>${e.length}</td><td>${e.game_time ? e.game_time.toFixed(1) + "s" : "–"}</td><td>${pct(c.dealt)} / ${pct(c.taken)}</td><td>${c.kills ?? "–"} / ${c.losses ?? "–"}</td><td>${mix(e.act)}</td><td>${pct(c.focus_dealt)} / ${pct(c.focus_taken)}</td><td>${ago(e.time)}</td></tr>`; }).join("") + `</table>` : `<div class="empty">no episodes yet</div>`;
  document.getElementById("cmd").textContent = (info.command || []).join(" ");
}

const slider = document.getElementById("smooth");
slider.value = ui.smooth; document.getElementById("smoothv").textContent = (+ui.smooth).toFixed(2);
slider.addEventListener("input", () => {
  ui.smooth = parseFloat(slider.value); document.getElementById("smoothv").textContent = ui.smooth.toFixed(2);
  try { localStorage.setItem("smooth", ui.smooth); } catch (e) {}
  for (const id in ui.charts) drawChart(id);
});
refresh();
setInterval(() => { if (document.getElementById("auto").checked) refresh(); }, 5000);
window.addEventListener("resize", () => { for (const id in ui.charts) drawChart(id); });
</script>
</body>
</html>
