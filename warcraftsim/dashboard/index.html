<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warcraftsim training</title>
<style>
:root { --bg:#0f1318; --panel:#171d24; --panel2:#1d252e; --line:#2a3440; --text:#d7dee6; --muted:#8795a3;
        --accent:#e0a33a; --good:#4cc38a; --bad:#e5534b; --blue:#539bf5; }
* { box-sizing:border-box; }
/* the page fills the window: the run list and the run's page scroll on their own */
body { margin:0; font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text);
       height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
header { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 18px; border-bottom:1px solid var(--line); background:#12171d; }
header h1, header .topnav, header #nav-challenge { flex:none; }  /* (the tabs whole: the controls on the right wrap first) */
header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
header h1 span { color:var(--accent); }
header .right { margin-left:auto; color:var(--muted); display:flex; gap:10px; align-items:center; }
.layout { flex:1; min-height:0; display:grid; grid-template-columns:270px 1fr; }
aside { border-right:1px solid var(--line); padding:10px 0 0 10px; background:#12171d; min-height:0;
        display:flex; flex-direction:column; overflow:hidden; }
aside > h2, .runtools { flex:none; }
#runs { flex:1; min-height:0; overflow-y:auto; padding:0 6px 10px 0; }
aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:6px 4px 8px; }
.run { padding:8px 9px; border-radius:6px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
.run:hover { background:var(--panel); }
.run.sel { background:var(--panel2); border-color:var(--line); }
.run .n { font-weight:600; display:flex; justify-content:space-between; gap:6px; align-items:center; }
.run .m { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; margin-top:2px; }
.run .m span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run .m span:last-child { flex:none; white-space:nowrap; margin-left:8px; }
.run .m span:only-child { flex:1; }
.run input { margin:0 6px 0 0; accent-color:var(--accent); }
.runtools { margin:0 4px 10px; display:flex; flex-direction:column; gap:6px; }
.runtools input[type=search] { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:5px;
  color:var(--text); padding:5px 8px; font:inherit; }
.runtools .row { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); white-space:nowrap; }
.runtools #selcount { margin-left:auto; }
.runtools button { background:var(--panel); border:1px solid var(--line); border-radius:5px; color:var(--text);
  padding:3px 8px; font:inherit; font-size:12px; cursor:pointer; }
.runtools button:hover { background:var(--panel2); }
.runtools label { display:flex; align-items:center; gap:5px; cursor:pointer; }
.runtools .types { display:flex; flex-wrap:wrap; gap:4px; }
.runtools .types button { padding:2px 7px; font-size:11.5px; color:var(--muted); }
.runtools .types button.on { background:var(--panel2); color:var(--text); border-color:var(--accent); }
.runtools .types button:disabled { opacity:.4; cursor:default; }
.runtools .types button .n { margin-left:4px; opacity:.7; }
.runtools label input { margin:0; accent-color:var(--accent); }
.badge { font-size:10px; padding:1px 6px; border-radius:9px; background:#2d3743; color:var(--muted); white-space:nowrap; }
.badge.training { background:#1e3a2c; color:var(--good); }
.badge.failed { background:#3d1f1f; color:var(--bad); }
.badge.finished { background:#1f2e44; color:var(--blue); }
main { padding:14px 18px 40px; overflow:auto; min-height:0; }
.title { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.title h2 { margin:0; font-size:18px; }
.title .desc { color:var(--muted); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); grid-auto-flow:row dense; gap:10px; margin-bottom:14px; }
.card.wide { grid-column:span 2; }
.bneck { margin-bottom:14px; }
.bverdict { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
.bgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr)); gap:10px; }
.bgrid .panel.wide { grid-column:1 / -1; }
.blegend { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; font-size:12px; color:var(--muted); }
.blegend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.blegend b { color:var(--text); font-weight:600; }
.ctip { position:fixed; display:none; z-index:30; pointer-events:none; background:var(--panel2); border:1px solid var(--line);
        border-radius:6px; padding:6px 9px; font-size:12px; line-height:1.55; color:var(--muted); max-width:300px; }
.ctip b { color:var(--text); } .ctip i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }  /* (a card with several numbers: the real game's, the rating's) */
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.card .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
.card .v { font-size:20px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
.card .v small { font-size:12px; color:var(--muted); font-weight:400; }
.progress { height:4px; background:#26303b; border-radius:2px; margin-top:6px; overflow:hidden; }
.progress div { height:100%; background:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:12px; }
.chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px 6px; position:relative; }
.chart h3 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; white-space:nowrap; }
.chart h3 > span { white-space:normal; text-align:right; margin-left:14px; }  /* (a long subtitle wraps, the title does not) */
.chart .plot { position:relative; }
/* a panel's controls (log scale, fullscreen): top right, shown on hover; a space kept for them so
   they never cover the subtitle; a log scale that is on stays shown */
.chart h3 { padding-right:46px; }
.chart .ctl { position:absolute; top:7px; right:8px; display:flex; gap:2px; opacity:0; transition:opacity .12s; z-index:6; }
.chart:hover .ctl, .chart .ctl.keep, .chart.full .ctl { opacity:1; }
.chart .ctl button { background:transparent; border:1px solid transparent; border-radius:4px; color:var(--muted);
                     font:600 10px/14px system-ui; padding:1px 4px; cursor:pointer; }
.chart .ctl button:hover { border-color:var(--line); color:var(--text); }
.chart .ctl button.on { color:var(--accent); border-color:#4a3c22; }
.chart.full { position:fixed; inset:14px; z-index:60; display:flex; flex-direction:column; padding:14px 18px 10px;
              box-shadow:0 0 0 100vmax rgba(5,8,11,.72); }
.chart.full h3 { font-size:14px; }
.chart.full .plot { flex:1 1 auto; min-height:0; }
.chart.full .plot > canvas:not(.overlay) { height:100%; }
.chart canvas { width:100%; height:210px; display:block; }
.chart .legend { font-size:11px; color:var(--muted); margin:4px 0 2px; line-height:1.6; }
.chart .legend span { margin-right:10px; white-space:nowrap; }
.chart .legend i { display:inline-block; width:10px; height:3px; margin:0 4px 2px 0; vertical-align:middle; border-radius:1px; }
.chart .legend.compact { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:0 8px; font-size:10.5px; line-height:1.5; }
.chart .legend.compact span { margin:0; overflow:hidden; text-overflow:ellipsis; }
.chart .legend svg { vertical-align:middle; margin-right:3px; }
.chart canvas.overlay { position:absolute; left:0; top:0; pointer-events:none; }
.legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:2px 0 10px; color:var(--muted); font-size:12px; }
.legend svg { vertical-align:middle; margin-right:5px; }
.smooth { display:flex; align-items:center; gap:6px; }
.smooth input { width:120px; accent-color:var(--accent); }
.tip { position:absolute; pointer-events:none; background:#0b0f13d9; border:1px solid var(--line); border-radius:6px; padding:4px 7px;
       font-size:11px; line-height:1.35; white-space:nowrap; display:none; z-index:5; }
.tip.hovered { background:#0b0f13f2; border-color:#4a5868; }
/* restarts on the charts (as Grafana's annotations): a dotted line, a badge at its foot, the note on hover */
.mark { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; z-index:4; cursor:pointer; }
.mark i { position:absolute; left:3px; top:3px; width:7px; height:7px; background:#e0a33a; border-radius:1.5px;
          transform:rotate(45deg); box-shadow:0 0 0 1.5px var(--panel); }
.mark:hover i { background:#ffc35c; }
.mark.on i { background:#ffc35c; box-shadow:0 0 0 1.5px var(--panel), 0 0 0 3px #e0a33a; }
.mark-tip .mh { margin-top:5px; color:var(--muted); font-size:10.5px; }
/* the step charts zoomed to one restart's span (its diamond clicked; a double-click on a chart undoes it) */
.zoomnote { display:none; margin:-4px 0 10px; padding:4px 9px; border:1px solid #5a4420; background:#211a10; border-radius:6px;
            color:#e0c08a; font-size:12px; width:fit-content; }
.zoomnote.on { display:block; }
.zoomnote button { margin-left:8px; background:none; border:1px solid #5a4420; border-radius:4px; color:#e0c08a; font:inherit; font-size:11px; cursor:pointer; }
.mark .mark-tip { display:none; position:absolute; bottom:15px; left:50%; transform:translateX(-50%); width:max-content;
                  max-width:340px; background:#0b0f13f2; border:1px solid #4a5868; border-radius:6px; padding:5px 8px;
                  font-size:11px; line-height:1.4; white-space:normal; z-index:6; }
.mark .mark-tip.l { left:-2px; transform:none; }
.mark .mark-tip.r { left:auto; right:-2px; transform:none; }
.mark:hover .mark-tip { display:block; }
.mark-tip > div + div.mt { margin-top:6px; padding-top:5px; border-top:1px solid var(--line); }
.mark-tip .mt b { color:#e0a33a; font-weight:600; }
.mark-tip .mt span, .mark-tip .ms { color:var(--muted); }
.mark-tip .mn { margin-top:3px; color:var(--text); }
section { margin-top:18px; }
section > h3 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
/* replays: one player, the episodes beside it */
.rp-top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; color:var(--muted); font-size:12px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { background:var(--panel); border:0; color:var(--muted); padding:4px 12px; font:inherit; font-size:12px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--line); }
.seg button.on { background:var(--panel2); color:var(--text); }
.seg button:disabled { opacity:.45; cursor:default; }
.seg .n { margin-left:5px; color:var(--muted); }
.replays { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:12px; align-items:start; }
@media (max-width: 1100px) { .replays { grid-template-columns:1fr; } }
.viewer { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.viewer video { display:block; width:100%; max-height:calc(100vh - 290px); background:#000; }
.viewer iframe { display:block; width:100%; height:calc(100vh - 290px); min-height:380px; border:0; background:var(--bg); }
.viewer .cap { padding:8px 12px; display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line); }
.viewer .cap a { color:var(--blue); text-decoration:none; }
.viewer .none { padding:60px 20px; text-align:center; color:var(--muted); }
/* a video's info: both sides' heroes and play, the learner's target (videos.py) */
.vinfo { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-top:10px; padding:10px 12px; font-size:12.5px; }
.vinfo.muted, .vinfo .muted { color:var(--muted); }
.vsides { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
@media (max-width: 760px) { .vsides { grid-template-columns:1fr; } }
.vh { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; }
.hchip { display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:1px 8px; margin:0 4px 4px 0; }
.hchip.neutral { border-color:var(--accent); color:var(--accent); }
.hchip small { color:var(--muted); }
.vfacts { color:var(--muted); margin-top:2px; }
.vt { margin-top:10px; }
table.vtt { width:auto; min-width:280px; font-size:12px; margin-top:2px; }
table.vtt td, table.vtt th { padding:2px 10px; }
table.vtt tr.miss td:last-child { color:var(--red, #e5534b); }
table.vtt tr.late td:last-child { color:#e0a33a; }
table.vtt tr.ok td:last-child { color:#4cc38a; }
.playlist .tags { grid-column:1 / -1; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.playlist .tags b { color:var(--accent); font-weight:500; }
.videos h2 { margin:0 0 6px; font-size:18px; } .videos .sub { color:var(--muted); max-width:860px; margin:0 0 12px; }
.vbar { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:10px; color:var(--muted); font-size:12px; }
.vbar input[type=search] { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; min-width:260px; font:inherit; }
.vbar .tg { background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--muted); padding:3px 10px; font:inherit; font-size:12px; cursor:pointer; }
.vbar .tg.on { color:var(--text); border-color:var(--accent); background:var(--panel2); }
@media (max-width: 760px) { .vbar input[type=search] { min-width:0; width:100%; } }
.playlist { background:var(--panel); border:1px solid var(--line); border-radius:8px; max-height:calc(100vh - 250px); overflow-y:auto; }
.playlist .it { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:1px 8px; font-size:12px; }
.playlist .it:last-child { border-bottom:0; }
.playlist .it:hover { background:var(--panel2); }
.playlist .it.on { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
.playlist .ep { font-weight:600; }
.playlist .sub { color:var(--muted); font-variant-numeric:tabular-nums; }
.grid h4 { grid-column:1/-1; margin:8px 0 -4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
.item .cap { padding:6px 10px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.item .cap a { color:var(--blue); text-decoration:none; }
.win { color:var(--good); } .loss { color:var(--bad); }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
th, td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.empty { color:var(--muted); padding:30px; text-align:center; }
pre.cmd { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--muted); white-space:pre-wrap; font-size:11px; margin:0 0 8px; }
.sweep { padding:7px 9px; border-radius:6px; cursor:pointer; margin-bottom:4px; border:1px solid var(--line); background:#151b22; }
.sweep:hover { background:var(--panel); }
.sweep.sel { background:var(--panel2); border-color:#4a5868; }
.sweep.has-shown { border-left:3px solid var(--accent); }
.sweep .n { font-weight:600; display:flex; justify-content:space-between; gap:6px; align-items:center; }
.sweep .n > span:first-child { display:flex; align-items:center; min-width:0; }
.sweep .m { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; margin-top:2px; }
.sweep .m span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sweep .m span:last-child { flex:none; white-space:nowrap; margin-left:8px; }
.sweep input { margin:0 6px 0 0; accent-color:var(--accent); }
.caret { background:none; border:0; color:var(--muted); cursor:pointer; padding:0 4px 0 0; font:inherit; width:16px; text-align:left; }
.sweepruns { margin:-2px 0 6px 12px; padding-left:6px; border-left:1px dashed var(--line); }
.sweep .note, .sweep .from { font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sweep .note { color:var(--text); opacity:.8; } .sweep .from { color:var(--muted); }
table.runs td, table.runs th { font-size:12px; padding:4px 8px; }
/* a run's page: tabs, the bar stays at the top while the tab scrolls */
.tabs { display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); margin:0 -18px 14px; padding:0 18px;
        position:sticky; top:-14px; background:var(--bg); z-index:4; }
.tab { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:8px 12px 7px; font:inherit;
       cursor:pointer; margin-bottom:-1px; }
.tab:hover { color:var(--text); }
.tab.on { color:var(--text); border-bottom-color:var(--accent); }
.tab .count { font-size:10px; padding:0 5px; border-radius:8px; background:var(--panel2); margin-left:4px; }
.pane > .grid { margin-top:2px; }
.spaces { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:12px; }
.spaces table td, .spaces table th { font-size:12px; padding:4px 8px; vertical-align:top; }
.spaces details summary { cursor:pointer; color:var(--blue); }
.spaces ol { margin:4px 0 2px; padding-left:34px; columns:2; column-gap:18px; font-size:11.5px; color:var(--muted); }
.spaces ol li::marker { color:#5d6b79; }
.chips { display:flex; flex-wrap:wrap; gap:3px; }
.chips span { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11.5px; }
.warn { color:var(--accent); }
.badge.bc { background:#2d2440; color:#b083f0; }
.badge.demos { background:#1f3a44; color:#39c5cf; }
.badge.collecting { background:#1e3a2c; color:var(--good); }
table.matrix td, table.matrix th { text-align:center; padding:3px 8px; }
table.matrix td.w { font-variant-numeric: tabular-nums; }
/* matchups: win rates by race, a cell's colour from red (all lost) through grey (even) to green (all won) */
.mu-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:2px 0 12px; color:var(--muted); font-size:12px; }
.mu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(440px,1fr)); gap:12px; }
table.mu { border-collapse:separate; border-spacing:3px; width:100%; }
table.mu th { font-size:11px; font-weight:500; color:var(--muted); padding:2px 4px; }
table.mu th.r { text-align:right; white-space:nowrap; }
table.mu td { text-align:center; border-radius:4px; padding:7px 4px 5px; font-variant-numeric:tabular-nums; font-size:14px; font-weight:600; }
table.mu td small { display:block; font-size:10px; font-weight:400; color:var(--muted); margin-top:1px; }
table.mu td.none { color:var(--muted); font-weight:400; background:var(--panel2); }
table.mu td.tot { outline:1px solid var(--line); }
.cks td { vertical-align:top; } .cks .role { color:var(--muted); font-size:12px; }
.cks .tag { font-size:11px; padding:1px 6px; border-radius:9px; background:#2d3743; color:var(--muted); margin-right:4px; white-space:nowrap; }
.cks .tag.lg { background:#1f3a44; color:#39c5cf; } .cks .tag.ev { background:#1e3a2c; color:var(--good); }
.cks button, .cks a.dl { background:var(--panel); border:1px solid var(--line); border-radius:5px; color:var(--text);
  padding:1px 7px; font:inherit; font-size:11.5px; cursor:pointer; text-decoration:none; margin-right:4px; }
table.runs td.opts { font-family:ui-monospace, monospace; font-size:11.5px; }
.pr-item { display:inline-block; margin:1px 8px 1px 0; white-space:nowrap; }
table.runs tr.shown td { background:var(--panel2); }
.run .from, .run .note { font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run .from { color:var(--muted); }
.run .note { color:var(--text); opacity:.8; }
.about { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:14px; }
textarea#notes { min-height:220px; }  /* (a run's notes: a few paragraphs, readable without scrolling) */
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.panel h3 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
.panel h3 span { font-weight:400; }
#notes, #runsummary { width:100%; min-height:74px; resize:vertical; background:var(--bg); color:var(--text); border:1px solid var(--line);
  border-radius:6px; padding:6px 8px; font:inherit; }
#runsummary { min-height:0; margin-bottom:6px; padding:4px 8px; }
.panel .row { display:flex; gap:8px; align-items:center; margin-top:6px; font-size:12px; color:var(--muted); }

<body>
<header>
  <button id="menu" title="the runs">☰</button>
  <h1>warcraft<span>sim</span></h1>
  <span class="seg topnav"><button id="nav-runs" class="on">Runs</button><button id="nav-lineage">Lineage</button><button id="nav-ratings">Ratings</button><button id="nav-videos">Videos</button><button id="nav-docs">Docs</button></span>
  <button id="nav-challenge" class="challenge-btn" title="play against a policy in the game">⚔ Challenge</button>
  <div class="right"><label class="smooth" title="exponential moving average over the points of every chart"><span class="lbl">smoothing</span>
    <input type="range" id="smooth" min="0" max="0.99" step="0.01"><span id="smoothv"></span></label>
    <span id="clock"></span><label><input type="checkbox" id="auto" checked> auto-refresh</label></div>
</header>
<div class="layout">
  <aside><h2>Runs <span style="float:right;text-transform:none;letter-spacing:0">☑ compare</span></h2>
    <div class="runtools">
      <input type="search" id="runfilter" placeholder="filter: name, task, sweep options, notes, parent" autocomplete="off">
      <div class="types" id="runtypes" title="list only these kinds (none selected: all)"></div>
      <div class="row"><button id="selall" title="compare every run listed">select all</button>
        <button id="selnone" title="compare none">clear</button><span id="selcount"></span></div>
      <div class="row"><label title="list only the compared runs (and the one shown)"><input type="checkbox" id="selonly"> show selected only</label></div>
    </div>
    <div id="runs"></div></aside>
  <main id="main"><div class="empty">Loading the runs…</div></main>
</div>
<script>
const COLORS = ["#e0a33a", "#539bf5", "#4cc38a", "#e5534b", "#b083f0", "#39c5cf", "#f47067", "#c69026"];
// line style per compared run (a whole sweep is often compared: 12 distinct ones, then they repeat)
const DASHES = [[], [7, 4], [2, 3], [10, 3, 2, 3], [14, 5], [4, 2, 1, 2], [1, 5], [18, 3, 3, 3, 3, 3],
                [5, 5], [10, 2, 2, 2, 2, 2], [3, 6, 9, 6], [20, 6]];
let state = { runs: [], sweeps: [], selected: null, compare: new Set(), data: {}, dataVer: {}, mediaKey: "",
              view: "run", sweep: null };  // view: a run's page, or a sweep's (state.sweep)
const ui = { smooth: 0.6, hoverX: null, hoverChart: null, charts: {}, full: null };
try { ui.logy = new Set(JSON.parse(localStorage.getItem("logy") || "[]")); } catch (e) { ui.logy = new Set(); }
try { const v = parseFloat(localStorage.getItem("smooth")); if (!Number.isNaN(v)) ui.smooth = v; } catch (e) {}
// the page's address: /run/<name>, /sweep/<group> or /doc/<name>, and ?tab=…&compare=A,B&smooth=0.8. Each
// page change is a browser history entry (back and forward work); compared runs and smoothing replace it.
// Links of the form #run=…&tab=… (from before) still open.
function parseUrl() {
  const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  const q = new URLSearchParams(location.search), out = { view: null, name: null, q };
  if (parts[0] === "run" && parts.length > 1) { out.view = "run"; out.name = parts.slice(1).join("/"); }
  else if (parts[0] === "sweep" && parts.length > 1) { out.view = "sweep"; out.name = parts.slice(1).join("/"); }
  else if (parts[0] === "doc") { out.view = "docs"; out.name = parts.slice(1).join("/") || null; }
  else if (parts[0] === "lineage") out.view = "lineage";
  else if (parts[0] === "ratings") out.view = "ratings";
  else if (parts[0] === "videos") out.view = "videos";
  if (!out.view && location.hash.length > 1) {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("run")) { out.view = "run"; out.name = h.get("run"); }
    else if (h.get("sweep")) { out.view = "sweep"; out.name = h.get("sweep"); }
    else if (h.has("docs")) { out.view = "docs"; out.name = h.get("docs") || null; }
    for (const k of ["tab", "compare", "smooth", "hover"]) if (h.get(k) !== null) q.set(k, h.get(k));
  }
  return out;
}
const encPath = n => n.split("/").map(encodeURIComponent).join("/");
function runTabKind() {
  const dk = state.view === "run" && state.data[state.selected] ? state.data[state.selected].kind : "run";
  return dk === "bc" && state.data[state.selected].info.task === "fullgame" ? "fullbc" : dk === "bc" || dk === "collect" ? dk : "run";
}
function urlFor() {
  let path = "/";
  if (state.view === "docs") path = "/doc/" + (ui.docs && ui.docs.doc ? encPath(ui.docs.doc.name) : "");
  else if (state.view === "lineage") return "/lineage" + (ui.lineage && ui.lineage.track === "micro" ? "?track=micro" : "");
  else if (state.view === "ratings") return "/ratings";
  else if (state.view === "videos") return "/videos" + (ui.videos && ui.videos.q ? "?q=" + encodeURIComponent(ui.videos.q) : "");
  else if (state.view === "sweep" && state.sweep) path = "/sweep/" + encPath(state.sweep);
  else if (state.selected) path = "/run/" + encPath(state.selected);
  const q = new URLSearchParams();
  if (state.view !== "docs") {
    if (state.compare.size) q.set("compare", [...state.compare].join(","));
    const kind = runTabKind();
    if (state.view === "run" && ui.tabs && ui.tabs[kind] && ui.tabs[kind] !== "overview") q.set("tab", ui.tabs[kind]);
  }
  return path + (q.toString() ? "?" + q.toString() : "");
}
let navigating = false;  // restoring a history entry: no new entry
function saveUrl(push = false) {
  const url = urlFor();
  if (url === location.pathname + location.search && !location.hash) return;
  if (push && !navigating) history.pushState(null, "", url); else history.replaceState(null, "", url);
}
(() => {
  const u = parseUrl(), h = u.q;
  if (u.view === "run") state.selected = u.name;
  if (u.view === "sweep") { state.view = "sweep"; state.sweep = u.name; }
  if (u.view === "docs") state.view = "docs";
  if (u.view === "lineage") state.view = "lineage";
  if (u.view === "ratings") state.view = "ratings";
  if (u.view === "videos") state.view = "videos";
  if (h.get("compare")) h.get("compare").split(",").filter(Boolean).forEach(n => state.compare.add(n));
  if (h.get("smooth") !== null && !Number.isNaN(parseFloat(h.get("smooth")))) ui.smooth = parseFloat(h.get("smooth"));
  if (h.get("hover")) ui.hoverX = parseFloat(h.get("hover"));  // a cursor position (screenshots)
})();

function fmt(v, d = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "K";
  if (a >= 100) return v.toFixed(0);
  if (a > 0 && a < 0.01) return v.toExponential(1);
  return v.toFixed(d);
}
function ago(t) {
  if (!t) return "–";
  const s = Date.now() / 1000 - t;
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return (s / 3600).toFixed(1) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function dur(s) {
  if (!s || s < 0) return "–";
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
}
function badge(status) {
  const cls = status === "training" ? "training" : status.startsWith("failed") ? "failed" : status === "finished" ? "finished" : "";
  return `<span class="badge ${cls}">${status}</span>`;
}
function dashSvg(dash, color = "#d7dee6") {
  return `<svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="${color}" stroke-width="2" stroke-dasharray="${dash.join(",")}"/></svg>`;
}
// TensorBoard-style debiased exponential moving average
function smooth(points, a) {
  if (!(a > 0) || points.length < 3) return points;
  let last = 0, w = 0;
  return points.map(([x, y]) => { last = last * a + (1 - a) * y; w = w * a + (1 - a); return [x, last / w]; });
}

// ---- charts: base canvas + overlay canvas (crosshair shared by all charts) -------------------
function drawChart(id) {
  const c = ui.charts[id]; if (!c) return;
  const canvas = c.canvas, dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.parentElement.querySelectorAll(".mark").forEach(e => e.remove());
  if (!W) { c.geo = null; return; }  // in a hidden tab: drawn when the tab is shown
  canvas.width = W * dpr; canvas.height = H * dpr;
  c.overlay.width = W * dpr; c.overlay.height = H * dpr; c.overlay.style.width = W + "px"; c.overlay.style.height = H + "px";
  const g = canvas.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const pad = { l: 46, r: 10, t: 8, b: 22 };
  // zoomed to a restart's span (its diamond clicked): only its points, smoothed from its start
  const zoom = (c.opts.axis || "steps") === "steps" && ui.stepsZoom ? ui.xranges.steps : null;
  const series = c.series.map(s => {
    const points = zoom ? s.points.filter(p => p[0] >= zoom[0] && p[0] <= zoom[1]) : s.points;
    return { ...s, points, pts: s.dots || s.raw ? points : smooth(points, ui.smooth) };
  });

  // a legend when a chart has many lines (names otherwise only on hover)
  const withData = series.filter(s => s.pts.length), box = canvas.closest(".chart");
  let lg = box && box.querySelector(".legend");
  if (box && !lg && withData.length >= 3) { lg = document.createElement("div"); lg.className = "legend"; box.appendChild(lg); }
  if (lg) {  // (many lines: a compact grid; a line with a dash shows it)
    lg.classList.toggle("compact", withData.length >= 9);
    lg.innerHTML = withData.length >= 3 ? withData.map(s => `<span>${s.dash && s.dash.length ? dashSvg(s.dash, s.color).replace('width="34"', 'width="18"').replace('x2="34"', 'x2="18"') : `<i style="background:${s.color}"></i>`}${esc(s.name)}${s.runName ? ` <small>${esc(s.runName)}</small>` : ""}</span>`).join("") : "";
  }
  c.geo = null;
  if (!pts.length) { g.fillStyle = "#8795a3"; g.font = "11px system-ui"; g.fillText(zoom ? "no data in this restart's span" : c.opts.empty || "no data yet", 12, H / 2); return; }
  // one x range for all charts of an axis (0 .. the latest step of the shown runs), so they line up
  const xr = c.opts.xfit ? null : (ui.xranges || {})[c.opts.axis || "steps"];  // (xfit: data recorded only lately)
  let x0 = xr ? xr[0] : Math.min(...pts.map(p => p[0]));
  let x1 = xr ? xr[1] : Math.max(...pts.map(p => p[0]));
  if (zoom && c.opts.xfit) { x0 = Math.max(x0, zoom[0]); x1 = Math.min(x1, zoom[1]); }
  // y range without the most extreme 0.5% on either side (a partial last epoch reports huge SPS);
  // on a log scale (the panel's "log"): of the positive values, in decades
  const logy = ui.logy.has(id) !== !!c.opts.log, T = logy ? (y => y > 0 ? Math.log10(y) : NaN) : (y => y);  // (opts.log: log unless toggled)
  const ys = pts.map(p => T(p[1])).filter(Number.isFinite).sort((a, b) => a - b), q = k => ys[Math.min(ys.length - 1, Math.max(0, Math.round(k * (ys.length - 1))))];
  if (!ys.length) { g.fillStyle = "#8795a3"; g.font = "11px system-ui"; g.fillText("no positive values for a log scale", 12, H / 2); return; }
  const lim = v => v === undefined || (logy && !(v > 0)) ? undefined : T(v);  // (a minimum of 0: none on a log scale)
  const ymin = lim(c.opts.ymin), ymax = lim(c.opts.ymax);
  let y0 = ymin ?? (ys.length > 50 ? q(0.005) : ys[0]), y1 = ymax ?? (ys.length > 50 ? q(0.995) : ys[ys.length - 1]);
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) { y1 += 1; y0 -= ymin !== undefined ? 0 : 1; }
  const yr = y1 - y0; if (ymin === undefined) y0 -= yr * 0.05; if (ymax === undefined) y1 += yr * 0.05;
  const X = x => pad.l + (x - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const Yraw = v => H - pad.b - (v - y0) / (y1 - y0) * (H - pad.t - pad.b);
  const Y = y => { const v = T(y); return Number.isFinite(v) ? Math.max(pad.t - 2, Math.min(H - pad.b + 2, Yraw(v))) : H - pad.b + 2; };  // clip outliers to the frame
  g.font = "10px system-ui"; g.strokeStyle = "#2a3440"; g.fillStyle = "#8795a3"; g.lineWidth = 1;
  let ticks = [0, 1, 2, 3, 4].map(i => y0 + (y1 - y0) * i / 4);
  if (logy && Math.floor(y1) - Math.ceil(y0) >= 1) {  // two or more decades: a line at each (at most 6)
    const k0 = Math.ceil(y0), k1 = Math.floor(y1), step = Math.ceil((k1 - k0 + 1) / 6);
    ticks = []; for (let k = k0; k <= k1; k += step) ticks.push(k);
  }
  for (const v of ticks) {
    const py = Math.round(Math.max(pad.t - 2, Math.min(H - pad.b + 2, Yraw(v)))) + .5;
    g.beginPath(); g.moveTo(pad.l, py); g.lineTo(W - pad.r, py); g.stroke();
    g.fillText(fmt(logy ? 10 ** v : v), 4, py + 3);
  }
  for (let i = 0; i <= 4; i++) {
    const x = x0 + (x1 - x0) * i / 4;
    g.fillText(fmt(x, 0), Math.min(X(x) - 12, W - 40), H - 6);
  }
  g.save(); g.beginPath(); g.rect(pad.l, 0, W - pad.l - pad.r, H); g.clip();  // (zoomed: the lines beyond the plot cut)

    if (!s.pts.length) continue;
    g.strokeStyle = g.fillStyle = s.color; g.lineWidth = s.run === 0 ? 1.8 : 1.5; g.setLineDash(s.dash || []);
    if (s.dots) {
      for (const p of s.pts) { g.beginPath(); g.arc(X(p[0]), Y(p[1]), 3, 0, 7); s.run === 0 ? g.fill() : g.stroke(); }
    } else {
      if (ui.smooth > 0 && s.points.length > 2) {  // the raw points, faint, under the smoothed line

        s.points.forEach((p, j) => j ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke(); g.globalAlpha = 1;
      }
      g.beginPath(); s.pts.forEach((p, j) => j ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke();
    }
    g.setLineDash([]);
  }
  g.restore();
  // restarts: a dotted line each, and at its foot a badge with the note (restarts at one step share one)
  const marks = new Map();
  for (const m of c.marks || []) {
    if (m.x < x0 || m.x > x1) continue;
    const px = Math.round(X(m.x)) + .5;
    marks.set(px, [...(marks.get(px) || []), m]);
  }
  for (const [px, ms] of marks) {
    g.strokeStyle = "rgba(224,163,58,.6)"; g.lineWidth = 1; g.setLineDash([2, 3]);
    g.beginPath(); g.moveTo(px, pad.t); g.lineTo(px, H - pad.b); g.stroke(); g.setLineDash([]);
    const el = document.createElement("div");
    el.className = "mark"; el.style.left = px + "px"; el.style.top = (H - pad.b) + "px";
    el.innerHTML = `<i></i><div class="mark-tip ${px < 170 ? "l" : px > W - 170 ? "r" : ""}">${ms.map(markHtml).join("")}</div>`;
    const m = ms[ms.length - 1];  // (restarts at one step: the latest)
    el.classList.toggle("on", !!ui.stepsZoom && ui.stepsZoom.from === m.x);
    el.addEventListener("click", ev => { ev.stopPropagation(); zoomTo(m, c.marks); });
    el.addEventListener("dblclick", ev => ev.stopPropagation());
    canvas.parentElement.appendChild(el);
  }
  c.geo = { series, X, Y, x0, x1, pad, W, H };
  drawCrosshair(id);
}

function markHtml(m) {  // a restart's note: when, at which step, from which checkpoint, why
  const when = new Date(m.time * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  return `<div class="mt"><b>restarted</b>${m.runName ? ` <span>${esc(m.runName)}</span>` : ""} <span>${when}</span></div>` +
    `<div class="ms">at ${fmt(m.steps || 0, 0)} steps · update ${m.update ?? "–"}${m.checkpoint ? ` · from ${esc(m.checkpoint)}` : ""}</div>` +
    (m.note ? `<div class="mn">${esc(m.note)}</div>` : "") +
    `<div class="mh">click: only this restart's data · double-click a chart: everything</div>`;
}

// ---- the step charts zoomed to one restart: from its diamond to the next restart of its run (or now) ----
function zoomTo(m, marks) {
  const later = (marks || []).filter(o => o.x > m.x && (o.runName || "") === (m.runName || "")).map(o => o.x);
  const same = ui.stepsZoom && ui.stepsZoom.from === m.x;
  ui.stepsZoom = same ? null : { run: state.selected, from: m.x, to: later.length ? Math.min(...later) : null, mark: m };
  applyZoom();
}
function applyZoom() {
  const full = ui.stepsFull; if (!full) return;
  ui.xranges = { ...(ui.xranges || {}), steps: ui.stepsZoom ? [ui.stepsZoom.from, ui.stepsZoom.to ?? full[1]] : full };
  showZoomNote();
  for (const id in ui.charts) if ((ui.charts[id].opts.axis || "steps") === "steps") drawChart(id);
}
function showZoomNote() {
  const el = document.getElementById("zoomnote"); if (!el) return;
  const z = ui.stepsZoom;
  el.classList.toggle("on", !!z);
  if (!z) { el.innerHTML = ""; return; }
  const m = z.mark, name = m.title || (m.note ? m.note.slice(0, 60) + (m.note.length > 60 ? "…" : "") : "");
  el.innerHTML = `Only the restart at ${fmt(m.steps || 0, 0)} steps${name ? ` (${esc(name)})` : ""}: steps ${fmt(z.from, 0)} – ` +
    `${z.to == null ? "now" : fmt(z.to, 0)} · double-click a chart for everything<button>show everything</button>`;
  el.querySelector("button").onclick = () => { ui.stepsZoom = null; applyZoom(); };
}

function nearest(pts, x) {
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m][0] < x) lo = m; else hi = m; }
  return Math.abs(pts[lo][0] - x) <= Math.abs(pts[hi][0] - x) ? pts[lo] : pts[hi];
}

function drawCrosshair(id) {
  const c = ui.charts[id]; if (!c) return;
  const dpr = window.devicePixelRatio || 1, g = c.overlay.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, c.overlay.width, c.overlay.height);
  const geo = c.geo, x = ui.hoverX;
  const axis = c.opts.axis || "steps";  // the cursor shows on the charts of the hovered one's axis
  if (!geo || x === null || x < geo.x0 || x > geo.x1 || (ui.hoverAxis || "steps") !== axis) { c.tip.style.display = "none"; return; }
  const px = Math.round(geo.X(x)) + .5;
  g.strokeStyle = "rgba(215,222,230,.55)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, geo.pad.t); g.lineTo(px, geo.H - geo.pad.b); g.stroke();
  const rows = [];
  for (const s of geo.series) {
    if (!s.pts.length) continue;
    const p = nearest(s.pts, x);
    g.fillStyle = s.color; g.beginPath(); g.arc(geo.X(p[0]), geo.Y(p[1]), 2.6, 0, 7); g.fill();
    rows.push(`<div>${dashSvg(s.dash || [], s.color)}${s.name}${s.runName ? ` <span style="color:#8795a3">${s.runName}</span>` : ""}: <b>${fmt(p[1], 3)}</b></div>`);
  }
  if (rows.length) {  // every chart shows its values at the hovered step
    c.tip.innerHTML = `<div style="color:#8795a3">${axis} ${fmt(x, axis === "steps" ? 0 : 1)}</div>` + rows.join("");
    c.tip.style.display = "block";
    c.tip.classList.toggle("hovered", ui.hoverChart === id);
    const w = c.tip.offsetWidth || 200;
    const left = px + 12 + w > geo.W ? px - 12 - w : px + 12;  // beside the line, inside the chart
    c.tip.style.left = Math.max(0, left) + "px"; c.tip.style.top = "6px";

function drawAllCrosshairs() { for (const id in ui.charts) drawCrosshair(id); }

// a panel over the whole page (its fullscreen button; Esc or the button again closes it)
function setFull(id) {
  const prev = ui.full; ui.full = id;
  for (const k of [prev, id]) {
    const c = k && ui.charts[k], box = c && c.canvas.closest(".chart"); if (!box) continue;
    box.classList.toggle("full", k === id);
    const fs = box.querySelector(".ctl .fs"); if (fs) { fs.textContent = k === id ? "✕" : "⤢"; fs.title = k === id ? "close (Esc)" : "fullscreen (Esc closes)"; }
  }
  requestAnimationFrame(() => { for (const k of [prev, id]) if (k && ui.charts[k]) drawChart(k); });
}
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.full) setFull(null); });

function registerChart(id, opts) {
  const canvas = document.getElementById(id), overlay = document.getElementById(id + "-ov"), tip = document.getElementById(id + "-tip");
  ui.charts[id] = { canvas, overlay, tip, opts, series: [], geo: null };
  const box = canvas.closest(".chart");
  if (box && !box.querySelector(".ctl")) {  // log scale and fullscreen, top right (shown on hover)
    box.insertAdjacentHTML("beforeend", `<div class="ctl"><button class="lg" title="log scale (y axis)">log</button>` +
      `<button class="fs" title="fullscreen (Esc closes)">⤢</button></div>`);
    const ctl = box.querySelector(".ctl"), lg = ctl.querySelector(".lg"), fs = ctl.querySelector(".fs");
    const showLog = () => { const on = ui.logy.has(id) !== !!opts.log; lg.classList.toggle("on", on); ctl.classList.toggle("keep", on); };
    showLog();
    lg.onclick = ev => {
      ev.stopPropagation();
      ui.logy.has(id) ? ui.logy.delete(id) : ui.logy.add(id);
      try { localStorage.setItem("logy", JSON.stringify([...ui.logy])); } catch (e) {}

    ui.hoverX = geo.x0 + (mx - geo.pad.l) / (geo.W - geo.pad.l - geo.pad.r) * (geo.x1 - geo.x0);

// ---- data --------------------------------------------------------------------------------------
// the answers are revalidated (the server's ETag: an unchanged one is a 304, nothing sent); one with the
// same ETag as before is not parsed again, and `seen.same` says so (nothing to draw anew)
const fetched = {};  // url -> {tag, value}
function setClock() {  // (a phone: the time alone)
  document.getElementById("clock").innerHTML = `<span class="lbl">updated </span>${new Date().toLocaleTimeString()}`;
}
async function getJSON(url, seen) {
  const r = await fetch(url, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status);
  const tag = r.headers.get("ETag"), last = fetched[url];
  if (tag && last && last.tag === tag) { if (seen) seen.same = true; return last.value; }
  const value = await r.json();
  if (tag) fetched[url] = { tag, value };
  if (seen) seen.same = false;
  return value;
}

// one refresh at a time: a click or the timer during one asks for another pass after it (with many
// runs compared, overlapping refreshes piled up and a click's refresh waited behind all of them)
let refreshing = null, refreshAgain = false;
function refresh() {
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = (async () => {
    try { do { refreshAgain = false; await refreshOnce(); } while (refreshAgain); }
    finally { refreshing = null; }
  })();
  return refreshing;
}
async function refreshOnce() {
  if (state.view === "videos") {  // new videos and their info as the server sums them up (videos.py)
    try {
      const V = await getJSON("/api/videos");
      if (V.updated !== (ui.videos.data || {}).updated || V.pending !== (ui.videos.data || {}).pending) { ui.videos.data = V; renderVideos(); }
    } catch (e) { console.error(e); }
    setClock();
    return;
  }
  if (state.view === "ratings") {  // re-drawn when the ratings changed (the server scans every 5 minutes)
    try {
      const R = await getJSON("/api/ratings");
      if (R.updated !== (ui.ratings.data || {}).updated) { ui.ratings.data = R; renderRatings(); }
    } catch (e) { console.error(e); }
    setClock();
    return;
  }
  if (state.view === "lineage") {  // the graph follows the runs: re-drawn (where it was) when it changed
    try {
      const L = await getJSON("/api/lineage");
      if (JSON.stringify(L) !== JSON.stringify(ui.lineage.data)) { ui.lineage.data = L; renderLineageGraph(); }
    } catch (e) { console.error(e); }
    setClock();
    return;
  }
  if (state.view === "docs") {  // the run list stays current; the document too, unless it is being edited
    try {
      [state.runs, state.sweeps] = await Promise.all([getJSON("/api/runs"), getJSON("/api/sweeps")]);
      renderRuns();
      if (!ui.docs.editing) {  // re-drawn only when a document changed (edited elsewhere, or a new one)
        const list = await getJSON("/api/docs"), cur = ui.docs.doc && list.find(d => d.name === ui.docs.doc.name);
        if (cur && cur.updated !== ui.docs.doc.updated) ui.docs.doc = await getJSON("/api/docs/" + encodeURIComponent(cur.name));
        if (JSON.stringify(list) !== JSON.stringify(ui.docs.list)) { ui.docs.list = list; renderDocs(); }
      }
    } catch (e) { console.error(e); }
    setClock();
    return;
  }
  try {
    const a = {}, b = {};
    [state.runs, state.sweeps] = await Promise.all([getJSON("/api/runs", a), getJSON("/api/sweeps", b)]);
    if (!state.selected && state.runs.length) state.selected = state.runs[0].name;
    // the list drawn anew when it changed (and every half minute: its "… ago")
    if (!a.same || !b.same || Date.now() - (ui.listDrawn || 0) > 30000) { renderRuns(); ui.listDrawn = Date.now(); }
    if (state.view === "sweep" && !(a.same && b.same)) renderSweep();
    // the shown run always; a compared run only when its files changed (finished runs: once)
    const ver = n => { const r = state.runs.find(r => r.name === n); return r ? `${r.status}|${(r.summary || {}).updated}` : ""; };
    const names = [...new Set([state.selected, ...state.compare].filter(Boolean))]
      .filter(n => n === state.selected || !state.data[n] || state.dataVer[n] !== ver(n));
    for (let i = 0; i < names.length; i += 6) {  // a few at a time
      let changed = false;  // (the same answers as before: the page stays as it is)
      await Promise.all(names.slice(i, i + 6).map(async n => {
        const seen = {}, had = state.data[n];
        state.data[n] = await getJSON("/api/runs/" + encodeURIComponent(n), seen);
        state.dataVer[n] = ver(n);
        if (!seen.same || !had) changed = true;
      }));
      if (changed && state.view === "run" && state.selected && state.data[state.selected]) renderMain();
    }
  } catch (e) { console.error(e); }
  setClock();
}
// the shown run in view in the run list (on a selection change, not on refreshes: those would
// fight scrolling the list)
function showSelectedRun() {
  if (state.view === "run") {  // a run inside a collapsed sweep: open the sweep
    const r = state.runs.find(r => r.name === state.selected);
    if (r && r.sweep && !ui.expanded.has(r.sweep.group)) { ui.expanded.add(r.sweep.group); keepExpanded(); renderRuns(); }
  }
  const el = state.view === "sweep" ? document.querySelector(`.sweep[data-sweep="${CSS.escape(state.sweep || "")}"]`)
                                    : document.querySelector(`.run[data-run="${CSS.escape(state.selected || "")}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect(), list = document.getElementById("runs").getBoundingClientRect();
  if (r.top < list.top || r.bottom > list.bottom + 1) el.scrollIntoView({ block: "center" });  // a visible one stays
}
// a selection change shows at once (with the data already loaded), then loads what is missing
function selectionChanged(push = false) {
  saveUrl(push); renderRuns(); showSelectedRun();
  if (state.view === "sweep") renderSweep();
  else if (state.selected && state.data[state.selected]) renderMain();
  else if (state.selected) {  // its data is on the way: not the previous page meanwhile
    const m = document.getElementById("main");
    m.dataset.run = ""; m.innerHTML = `<div class="empty">loading ${esc(state.selected)}…</div>`;
  }

}
function openRun(name) {
  if (state.view === "docs" && ui.docs.editing && !confirm("Leave the document without saving?")) return;
  if (!name) return;
  document.body.classList.remove("drawer");  // (a phone: the run list closes on a choice)
  state.view = "run"; state.selected = name; state.mediaKey = ""; setNav(); selectionChanged(true);
}
function openSweep(group) { document.body.classList.remove("drawer"); state.view = "sweep"; state.sweep = group; ui.expanded.add(group); keepExpanded(); setNav(); selectionChanged(true); }

// run list controls: a text filter, the kinds of runs listed, and "selected only" (the compared
// runs and the one shown)
const RUN_TYPES = [["training", "training", "reinforcement learning on the micro tasks"],
                   ["selfplay", "self-play", "reinforcement learning on whole games (fullgame/selfplay.py)"],
                   ["match", "matches", "two policies against each other (warcraftsim.match)"],
                   ["bc", "BC micro", "behavior cloning of the micro scripts"],
                   ["fullbc", "BC whole game", "behavior cloning of the built-in AI (fullgame/bc.py)"],
                   ["collect", "demos", "demonstration collections: the built-in AI against itself (fullgame/collect.py)"]];
function runType(r) {
  if (r.kind === "collect") return "collect";
  if (r.kind === "bc") return r.task === "fullgame" ? "fullbc" : "bc";
  if (r.kind === "match") return "match";
  return String(r.task || "").startsWith("fullgame") || r.trainer === "fullgame" ? "selfplay" : "training";
}
const runUI = { filter: "", only: false, types: new Set() };
try {
  runUI.filter = localStorage.getItem("runFilter") || ""; runUI.only = localStorage.getItem("runOnly") === "1";
  runUI.types = new Set(JSON.parse(localStorage.getItem("runTypes") || "[]"));
} catch (e) {}
const typeShown = r => !runUI.types.size || runUI.types.has(runType(r));
function listedRuns() {
  const words = runUI.filter.trim().toLowerCase().split(/\s+/).filter(Boolean);  // every word must match
  const text = r => [r.name, r.task, r.sweep ? r.sweep.options || "base" : "", r.title || "", r.notes || "",
                     r.parent ? `${r.parent.name} ${parentShort(r.parent)}` : ""].join(" ").toLowerCase();
  return state.runs.filter(r => typeShown(r) && (!words.length || words.every(w => text(r).includes(w)))
    && (!runUI.only || state.compare.has(r.name) || r.name === state.selected));
}
function renderRunTypes() {  // the kind toggles, with how many runs of each kind there are
  const box = document.getElementById("runtypes"); if (!box) return;
  const counts = {};
  for (const r of state.runs) counts[runType(r)] = (counts[runType(r)] || 0) + 1;
  const html = RUN_TYPES.map(([k, label, tip]) => `<button data-type="${k}" class="${runUI.types.has(k) ? "on" : ""}" title="${esc(tip)}"
      ${counts[k] || runUI.types.has(k) ? "" : "disabled"}>${label}<span class="n">${counts[k] || 0}</span></button>`).join("");
  if (box.dataset.html === html) return;
  box.dataset.html = html; box.innerHTML = html;
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = b.dataset.type;
    runUI.types.has(k) ? runUI.types.delete(k) : runUI.types.add(k);
    try { localStorage.setItem("runTypes", JSON.stringify([...runUI.types])); } catch (e) {}
    renderRuns();
  });
}
function setupRunTools() {
  const filter = document.getElementById("runfilter"), only = document.getElementById("selonly");
  filter.value = runUI.filter; only.checked = runUI.only;
  const keep = () => { try { localStorage.setItem("runFilter", runUI.filter); localStorage.setItem("runOnly", runUI.only ? "1" : "0"); } catch (e) {} };
  filter.oninput = () => { runUI.filter = filter.value; keep(); renderRuns(); };
  only.onchange = () => { runUI.only = only.checked; keep(); renderRuns(); };
  document.getElementById("selall").onclick = () => { listedRuns().forEach(r => state.compare.add(r.name)); selectionChanged(); };
  document.getElementById("selnone").onclick = () => { state.compare.clear(); selectionChanged(); };
}

// the run list: runs, and sweeps as groups of runs (collapsed unless opened, filtered or "selected only")
try { ui.expanded = new Set(JSON.parse(localStorage.getItem("expanded") || "[]")); } catch (e) { ui.expanded = new Set(); }
function keepExpanded() { try { localStorage.setItem("expanded", JSON.stringify([...ui.expanded])); } catch (e) {} }
function winText(s) { return s && s.win_rate_100 != null ? (100 * s.win_rate_100).toFixed(0) + "%" : "–"; }
function runCard(r, inSweep) {
  const s = r.summary || {};
  if (r.kind === "collect") return `<div class="run ${state.view === "run" && r.name === state.selected ? "sel" : ""}" data-run="${esc(r.name)}">
    <div class="n"><span><span class="badge demos" style="margin-right:6px">DEMOS</span>${esc(r.name.slice(9))}</span>${badge(r.status)}</div>
    <div class="m"><span>${esc(r.map || "")} · built-in AI (${esc(r.difficulty || "?")})</span><span>${s.rate_per_hour != null && r.status === "collecting" ? fmt(s.rate_per_hour, 0) + "/h" : ""}</span></div>
    <div class="m"><span>${fmt(s.games || 0, 0)}${r.planned ? " / " + fmt(r.planned, 0) : ""} games</span><span>${ago(s.updated)}</span></div>${r.notes && r.notes.trim() ? `
    <div class="note" title="${esc(r.notes.trim())}">${esc(r.notes.trim().split("\n")[0])}</div>` : ""}</div>`;
  if (r.kind === "bc" && r.task === "fullgame") return `<div class="run ${state.view === "run" && r.name === state.selected ? "sel" : ""}" data-run="${esc(r.name)}">
    <div class="n"><span><span class="badge bc" style="margin-right:6px">BC</span>${esc(r.dataset)}</span>${badge(r.status)}</div>
    <div class="m"><span>whole game · ${fmt(s.episodes || 0, 0)} games</span><span>vs AI ${winText(s)}</span></div>
    <div class="m"><span>${s.fit_epochs ? `${s.fit_epochs} epochs · order acc ${(100 * (s.fit_acc || 0)).toFixed(0)}%` : "not fitted yet"}</span><span>${(r.children || []).length} runs</span></div>${r.notes && r.notes.trim() ? `
    <div class="note" title="${esc(r.notes.trim())}">${esc(r.notes.trim().split("\n")[0])}</div>` : ""}</div>`;
  if (r.kind === "bc") return `<div class="run ${state.view === "run" && r.name === state.selected ? "sel" : ""}" data-run="${esc(r.name)}">
    <div class="n"><span><span class="badge bc" style="margin-right:6px">BC</span>${esc(r.policy || r.dataset)}</span>${badge(r.status)}</div>
    <div class="m"><span title="${esc(r.task)}">${esc(r.task)}</span><span>clone ${winText(s)}</span></div>
    <div class="m"><span>${fmt(s.episodes || 0, 0)} demos · script ${s.script_win_rate != null ? (100 * s.script_win_rate).toFixed(0) + "%" : "–"}</span><span>${(r.children || []).length} runs</span></div>${r.notes && r.notes.trim() ? `
    <div class="note" title="${esc(r.notes.trim())}">${esc(r.notes.trim().split("\n")[0])}</div>` : ""}</div>`;
  return `<div class="run ${state.view === "run" && r.name === state.selected ? "sel" : ""}" data-run="${esc(r.name)}">
    <div class="n"><span><input type="checkbox" data-cmp="${esc(r.name)}" ${state.compare.has(r.name) ? "checked" : ""}>${esc(r.name)}</span>${badge(r.status)}</div>${inSweep ? `
    <div class="m"><span title="${esc(r.sweep.options || "base")}" style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(r.sweep.options || "base options")}</span><span>win ${winText(s)}</span></div>
    <div class="m"><span>${fmt(s.agent_steps || 0, 0)} steps</span><span>${ago(s.updated)}</span></div>` : `
    <div class="m"><span title="${esc(r.task)} · ${r.envs} games">${r.kind === "match" && r.players ? `<span class="badge bc" style="background:#1f3a44;color:#39c5cf">MATCH</span> ${esc(r.players.A.name)} vs ${esc(r.players.B.name)}` : `${esc(r.task)} · ${r.envs} games`}</span><span>${r.kind === "match" ? "A " : "win "}${winText(s)}</span></div>
    <div class="m"><span>${r.kind === "match" ? `${fmt(s.episodes || 0, 0)} episodes` : `${fmt(s.agent_steps || 0, 0)} steps`}</span><span>${ago(s.updated)}</span></div>`}${r.parent && !(inSweep && inSweep.sameParent) ? `
    <div class="from" title="started from ${esc(parentText(r.parent))}">← ${esc(parentShort(r.parent))}</div>` : ""}${r.notes && r.notes.trim() ? `
    <div class="note" title="${esc(r.notes.trim())}">${esc(r.notes.trim().split("\n")[0])}</div>` : ""}</div>`;
}
function sweepStatus(runs) {  // the most telling status of a sweep's runs
  const st = runs.map(r => r.status || "");
  const n = f => st.filter(f).length;
  if (n(x => x === "training" || x.startsWith("launching") || x === "building")) return "training";
  if (n(x => x === "queued")) return "queued";
  if (n(x => x.startsWith("failed"))) return `failed ${n(x => x.startsWith("failed"))}/${st.length}`;
  if (n(x => x === "finished") === st.length) return "finished";
  return st.length ? st[0] : "";
}
function sweepHeader(g, runs, expanded, shown) {
  const inCmp = runs.filter(r => state.compare.has(r.name)).length;
  const best = runs.reduce((b, r) => (r.summary && r.summary.win_rate_100 != null && (!b || r.summary.win_rate_100 > b.summary.win_rate_100)) ? r : b, null);
  const parents = new Set(runs.map(r => r.parent ? parentShort(r.parent) : "scratch"));
  return `<div class="sweep ${state.view === "sweep" && state.sweep === g.group ? "sel" : ""} ${shown ? "has-shown" : ""}" data-sweep="${esc(g.group)}">
    <div class="n"><span><button class="caret" data-toggle="${esc(g.group)}" title="${expanded ? "collapse" : "expand"}">${expanded ? "▾" : "▸"}</button><input type="checkbox" data-cmpsweep="${esc(g.group)}" ${inCmp === runs.length && runs.length ? "checked" : ""} data-some="${inCmp > 0 && inCmp < runs.length ? 1 : 0}" title="compare all its runs">${esc(g.group)}</span>${badge(sweepStatus(runs))}</div>
    <div class="m"><span title="${esc(g.task)}">${esc(g.task)}</span><span>${runs.length} runs</span></div>
    <div class="m"><span>${best ? `best ${esc(best.name.slice(g.group.length + 1) ? "#" + best.name.slice(g.group.length + 1) : best.name)}: ${winText(best.summary)}` : "no episodes yet"}</span><span>${ago(Math.max(...runs.map(r => (r.summary || {}).updated || 0)))}</span></div>${[...parents].some(p => p !== "scratch") ? `
    <div class="from">← ${esc([...parents].join(", "))}</div>` : ""}${g.notes && g.notes.trim() ? `
    <div class="note" title="${esc(g.notes.trim())}">${esc(g.notes.trim().split("\n")[0])}</div>` : ""}</div>`;
}
function renderRuns() {
  renderRunTypes();
  const n = state.compare.size;
  document.getElementById("selcount").textContent = n ? `${n} selected` : "";
  const listed = new Set(listedRuns().map(r => r.name));
  const words = runUI.filter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const sweeps = new Map(state.sweeps.map(g => [g.group, g]));
  const html = [], done = new Set();
  for (const r of state.runs) {  // newest first; a sweep where its newest run is
    if (!r.sweep || !sweeps.has(r.sweep.group)) { if (listed.has(r.name)) html.push(runCard(r, null)); continue; }
    const g = sweeps.get(r.sweep.group);
    if (done.has(g.group)) continue;
    done.add(g.group);
    const all = g.runs.map(n => state.runs.find(x => x.name === n)).filter(Boolean);
    // a sweep whose name or description matches the filter lists all its runs
    const text = [g.group, g.notes || "", g.task || ""].join(" ").toLowerCase();
    const whole = words.length && words.every(w => text.includes(w));
    let members = all.filter(x => listed.has(x.name) || (whole && typeShown(x) && (!runUI.only || state.compare.has(x.name) || x.name === state.selected)));
    if (!members.length) continue;
    const auto = words.length > 0 || runUI.only;  // searching or "selected only": show what matched
    const expanded = ui.expanded.has(g.group) || (auto && !whole);
    const shown = state.view === "run" && all.some(x => x.name === state.selected);
    const sameParent = new Set(all.map(x => JSON.stringify(x.parent || null))).size === 1;
    html.push(sweepHeader(g, all, expanded, shown));
    if (expanded) html.push(`<div class="sweepruns">${members.map(x => runCard(x, { sameParent })).join("")}</div>`);
  }
  const box = document.getElementById("runs");
  box.innerHTML = html.join("") || `<div class="empty">${state.runs.length ? "no runs match" : "no runs"}</div>`;
  box.querySelectorAll("[data-some='1']").forEach(el => el.indeterminate = true);
  box.querySelectorAll(".run").forEach(el => el.onclick = ev => {
    if (ev.target.dataset.cmp) return;
    openRun(el.dataset.run);
  });
  box.querySelectorAll("[data-cmp]").forEach(el => el.onchange = () => {
    el.checked ? state.compare.add(el.dataset.cmp) : state.compare.delete(el.dataset.cmp); selectionChanged();
  });
  box.querySelectorAll(".sweep").forEach(el => el.onclick = ev => {
    if (ev.target.dataset.cmpsweep || ev.target.dataset.toggle) return;
    openSweep(el.dataset.sweep);
  });
  box.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => {
    const g = el.dataset.toggle;
    ui.expanded.has(g) ? ui.expanded.delete(g) : ui.expanded.add(g); keepExpanded(); renderRuns();
  });
  box.querySelectorAll("[data-cmpsweep]").forEach(el => el.onchange = () => {  // all its runs in or out
    const g = sweeps.get(el.dataset.cmpsweep); if (!g) return;
    const allIn = g.runs.every(n => state.compare.has(n));
    g.runs.forEach(n => allIn ? state.compare.delete(n) : state.compare.add(n));
    selectionChanged();
  });
}

// ---- a sweep's page ------------------------------------------------------------------------------
function renderSweep() {
  const g = state.sweeps.find(x => x.group === state.sweep), main = document.getElementById("main");
  if (!g) { if (state.sweeps.length) main.innerHTML = `<div class="empty">no sweep ${esc(state.sweep)}</div>`; return; }
  const runs = g.runs.map(n => state.runs.find(r => r.name === n)).filter(Boolean);
  if (main.dataset.run !== "sweep:" + g.group) {
    main.dataset.run = "sweep:" + g.group; ui.charts = {};
    main.innerHTML = `
      <div class="title"><h2>sweep ${esc(g.group)}</h2><span id="sweepbadge"></span><span class="desc">${esc(g.task)} · ${runs.length} runs · ${new Date(g.created * 1000).toLocaleString()}</span></div>
      <div class="about">
        <div class="panel"><h3>Description<span id="notestate"></span></h3>
          <textarea id="notes" placeholder="what this sweep tests and what came of it (runs/sweeps/${esc(g.group)}/notes.md)"></textarea>
          <div class="row"><button id="savenotes">save</button><span>Ctrl+Enter saves</span></div></div>
        <div class="panel"><h3>Lineage</h3><dl class="facts" id="lineage"></dl></div>
      </div>
      <div class="row" style="display:flex;gap:8px;margin:0 0 8px"><button class="copy" id="cmpall">compare all its runs in the charts</button><button class="copy" id="cmpnone">stop comparing them</button></div>
      <table class="runs" id="sweepruns"></table>
      <section><h3>Launch</h3><div id="launch"></div></section>`;
    setupNotes({ name: g.group, notes: g.notes }, "/api/sweeps/" + encodeURIComponent(g.group) + "/notes", () => {
      const x = state.sweeps.find(x => x.group === g.group); if (x) x.notes = document.getElementById("notes").value; });
    document.getElementById("cmpall").onclick = () => { g.runs.forEach(n => state.compare.add(n)); openRun(g.runs[0]); };
    document.getElementById("cmpnone").onclick = () => { g.runs.forEach(n => state.compare.delete(n)); selectionChanged(); };
  } else if (!ui.notesDirty && document.activeElement !== document.getElementById("notes")) {
    document.getElementById("notes").value = g.notes || "";
  }
  document.getElementById("sweepbadge").innerHTML = badge(sweepStatus(runs));
  const rows = [];
  for (const p of g.parents || []) {
    const q = p.parent;
    const what = !q ? "scratch (random weights)" : q.kind === "run" ? `${go(q.name)}${q.steps != null ? ` at ${fmt(q.steps, 0)} steps` : ""}`
      : q.kind === "bc" ? `behavior cloning of <b>${esc(q.policy || "?")}</b> on ${esc(q.task || "?")}${q.win_rate != null ? ` (the script wins ${(100 * q.win_rate).toFixed(0)}%)` : ""}` : esc(q.name);
    rows.push(["Started from", what + ((g.parents || []).length > 1 ? ` <span style="color:var(--muted)">(${p.runs} runs)</span>` : "")]);
  }
  rows.push(["Task", esc(g.task)]);
  const lin = document.getElementById("lineage");
  lin.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  bindGo(lin);
  document.getElementById("sweepruns").innerHTML = `<tr><th>#</th><th>run</th><th>its options</th><th>status</th><th>steps</th><th>win (last 100)</th><th>compare</th><th>notes</th></tr>` +
    runs.map(r => { const s = r.summary || {};
      return `<tr><td>${r.sweep.index}</td><td>${go(r.name)}</td><td class="opts">${esc(r.sweep.options || "base options")}</td><td>${badge(r.status)}</td>
        <td>${fmt(s.agent_steps || 0, 0)} / ${fmt(r.timesteps || 0, 0)}</td><td>${winText(s)}</td>
        <td><input type="checkbox" data-cmp="${esc(r.name)}" ${state.compare.has(r.name) ? "checked" : ""}></td>
        <td style="color:var(--muted)">${esc((r.notes || "").trim().split("\n")[0])}</td></tr>`; }).join("");
  const tbl = document.getElementById("sweepruns");
  bindGo(tbl);
  tbl.querySelectorAll("[data-cmp]").forEach(el => el.onchange = () => {
    el.checked ? state.compare.add(el.dataset.cmp) : state.compare.delete(el.dataset.cmp); selectionChanged();
  });
  renderLaunchInto(document.getElementById("launch"), g.launch || {}, null, true);
}

// ["trp", prefix(, suffix(, "nonzero" | [keys left out]))]: one series per trainer key with that prefix (and suffix;
// e.g. every script the league has)
// series named by race or matchup ("human", "human/orc": the learner's race / the opponent's): a colour per
// learner's race, a dash per opponent's (chart option matchups)
const RACE_COLORS = { human: "#539bf5", orc: "#e5534b", undead: "#b083f0", nightelf: "#4cc38a" };
const RACE_DASHES = { human: [], orc: [6, 3], undead: [2, 2], nightelf: [9, 3, 2, 3] };
function matchupStyle(name) {
  const [a, b] = name.split("/");
  return RACE_COLORS[a] ? { color: RACE_COLORS[a], dash: b ? RACE_DASHES[b] || [] : [] } : null;
}
// series named by opponent (chart option opponents): a colour per AI difficulty or kind of opponent, dashed
// for the curriculum's taxed AI ("ai-normal"), solid for the real game ("ai-normal (real)") and the agents
const OPPONENT_COLORS = [["easy", "#4cc38a"], ["normal", "#e0a33a"], ["insane", "#e5534b"], ["itself", "#539bf5"],
                         ["past", "#b083f0"], ["exploiter", "#8795a3"]];
function opponentStyle(name) {
  const c = OPPONENT_COLORS.find(([k]) => name.includes(k));
  return c ? { color: c[1], dash: name.startsWith("ai-") && !name.includes("(real)") ? [6, 3] : [] } : null;
}
const PREFIX_COLORS = ["#8795a3", "#e0a33a", "#b083f0", "#e5534b", "#539bf5", "#4cc38a", "#39c5cf", "#f56ed2"];
function expandDefs(defs, d) {
  const out = [];
  for (const def of defs) {
    if (def[0] !== "trp" && def[0] !== "epp") { out.push(def); continue; }
    const keys = new Set();
    const suffix = def[2] || "", nonzero = new Set();
    const rows = (d && (def[0] === "epp" ? [d.sparse || {}] : d.train)) || [];
    for (const r of rows) for (const k in r) if (k.startsWith(def[1]) && k.endsWith(suffix) && !k.endsWith("_n")) {
      keys.add(k);
      if (r[k]) nonzero.add(k);
    }
    if (def[3] === "nonzero") for (const k of [...keys]) if (!nonzero.has(k)) keys.delete(k);  // (e.g. no late start in a tax curriculum)
    if (Array.isArray(def[3])) for (const k of def[3]) keys.delete(k);
    [...keys].sort().forEach((k, i) => out.push([def[0] === "epp" ? "sp" : "tr", k, k.slice(def[1].length, k.length - suffix.length).trim() || "all races",
                                                 PREFIX_COLORS[i % PREFIX_COLORS.length]]));
  }
  return out;
}

function seriesPoints(d, src, key) {
  const o = d.info.init_steps || 0;  // a run continued from a checkpoint starts where its parent was
  if (src === "ep") return d.episodes.filter(e => e[key] !== undefined).map(e => [o + e.steps, e[key]]);
  if (src === "sp") return ((d.sparse || {})[key] || []).map(p => [o + p[0], p[1]]);  // (sparse series: their own bins)
  if (src === "tr") return d.train.filter(r => r[key] !== undefined).map(r => [o + (r.agent_steps ?? r.steps), r[key]]);
  if (src === "br") return d.bridge.map(b => [o + b.steps, b[key]]);
  if (src === "cal") return d.calibration.map(c => [o + c.steps, c[key]]);
  return [];
}

  if (!c.init || !(coef > 0)) return "none <small>(--ref-kl 0)</small>";

  const mode = { reverse: "KL(policy‖anchor), orders", forward: "KL(anchor‖policy), orders", "forward-all": "KL(anchor‖policy), every head" }[c.ref_kl_mode || "reverse"] || c.ref_kl_mode;
  const D = ui.ratings.data, r = D && D.players.find(p => p.name === name);
  return `${every > 0 ? `the policy ${every} updates ago` : esc(name)} <small>× ${coef} · ${esc(mode)}${every > 0 ? ` (rolling; first ${esc(name)})` : ""}${r ? ` · rated ${Math.round(r.rating)} ± ${Math.round(1.96 * (r.se || 0))}` : ""}</small>`;
}

    ? shown.map((n, i) => `<span>${dashSvg(DASHES[i % DASHES.length], runColor(i))}${n}${state.data[n]?.info?.sweep ? ` <span style="color:var(--muted)">${state.data[n].info.sweep.options}</span>` : ""}</span>`).join("")
    : "";
  // restarts (run.json "resumes"; --resume --note says why): markers on the charts of steps
  const marks = shown.flatMap((n, ri) => (state.data[n].info.resumes || []).map(r => ({ ...r, x: off(n) + (r.steps || 0),
                                                                                       runName: shown.length > 1 ? n : "" })));
  for (const [, charts] of SECTIONS) {
    for (const [id, , , defs] of charts) {
      const c = ui.charts[id]; if (!c) continue;
      c.marks = (c.opts.axis || "steps") === "steps" ? marks : [];
      c.series = [];
      shown.forEach((n, ri) => {
        for (const [src, key, name, color, dash] of expandDefs(defs, state.data[n])) {
          const mu = shown.length > 1 ? null : c.opts.matchups ? matchupStyle(name) : c.opts.opponents ? opponentStyle(name) : null;  // (comparing runs: a dash per run)
          c.series.push({ name, color: mu ? mu.color : defs.length === 1 && shown.length > 1 ? runColor(ri) : color, run: ri,
                          runName: shown.length > 1 ? n : "", dash: mu ? mu.dash : dash && shown.length === 1 ? dash : DASHES[ri % DASHES.length], many: shown.length > 1,
                          dots: src === "cal", points: seriesPoints(state.data[n], src, key) });
        }
      });
      drawChart(id);
    }
  }

  renderReplays(d);
  const pct = v => v === undefined ? "–" : (100 * v).toFixed(0) + "%";
  const mix = a => a ? ["noop", "stop", "retreat", "move", "attack", "cast"].filter(k => a[k] !== undefined).map(k => `${k} ${pct(a[k])}`).join(" · ") : "–";
  const outc = e => `<td class="${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : ""}">${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : "draw"}</td>`;
  if (info.trainer === "fullgame") {  // whole games: who against whom, and what each side made
    const two = (a, b, dg = 0) => `${a == null ? "–" : fmt(a, dg)} / ${b == null ? "–" : fmt(b, dg)}`;
    document.getElementById("episodes").innerHTML = d.recent_episodes.length ? `<table><tr><th>#</th><th>opponent</th><th>races (learner vs opponent)</th><th>outcome</th><th>return</th><th>game time</th>
        <th>material lead</th><th>army (learner / opponent)</th><th>heroes</th><th>kills / losses</th><th>gold / lumber</th><th>when</th></tr>` +
      d.recent_episodes.map(e => { const p = e.prod || {}, o = e.opp_prod || {};
        const opp = esc(e.opponent) + (e.ai_tax ? ` <small>taxed ${(100 * e.ai_tax).toFixed(0)}%</small>` : e.ai_delay ? ` <small>${fmt(e.ai_delay, 0)} s late</small>` : "")
          + (e.advised ? ` <small title="the built-in AI advised the learner (on-policy distillation)">advised</small>` : "")
          + (e.host ? ` <small title="an evaluation game another machine played (fullgame/evalworker.py, episodes-remote.jsonl)">on ${esc(e.host)}</small>` : "");
        return `<tr><td>${e.episode}</td><td>${opp}</td><td>${esc(e.race || "")} <small>vs</small> ${esc(e.opponent_race || "–")}</td>${outc(e)}<td>${fmt(e.return, 3)}</td><td>${e.game_time ? e.game_time.toFixed(1) + "s" : "–"}</td>
          <td>${fmt(e.material_lead, 2)}</td><td>${two(p.army, o.army)}</td><td>${two(p.heroes, o.heroes)}</td><td>${two(p.kills, p.lost)}</td><td>${two(e.gold, p.lumber)}</td><td>${ago(e.time)}</td></tr>`; }).join("") +
      `</table>` : `<div class="empty">no episodes yet</div>`;
  } else
  document.getElementById("episodes").innerHTML = d.recent_episodes.length ? `<table><tr><th>#</th><th>game</th><th>outcome</th><th>return</th><th>length</th><th>game time</th><th>dealt / taken</th><th>kills / losses</th><th>actions</th><th>focus dealt / taken</th><th>when</th></tr>` +
    d.recent_episodes.map(e => { const c = e.combat || {};
      return `<tr><td>${e.episode}</td><td>${e.env}</td><td class="${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : ""}">${e.outcome > 0 ? "win" : e.outcome < 0 ? "loss" : "draw"}</td><td>${fmt(e.return, 3)}</td><td>${e.length}</td><td>${e.game_time ? e.game_time.toFixed(1) + "s" : "–"}</td><td>${pct(c.dealt)} / ${pct(c.taken)}</td><td>${c.kills ?? "–"} / ${c.losses ?? "–"}</td><td>${mix(e.act)}</td><td>${pct(c.focus_dealt)} / ${pct(c.focus_taken)}</td><td>${ago(e.time)}</td></tr>`; }).join("") + `</table>` : `<div class="empty">no episodes yet</div>`;
  renderLaunch(info);
  renderEvals(d.evals);
  renderLeague(d);
}

// ---- a self-play league: its tabs only when the run has one --------------------------------------

  const has = !!d.league || (d.train || []).some(r => Object.keys(r).some(k => k.startsWith("league/")));

    <table class="runs"><tr><th>opponent</th><th>games</th><th>wins</th><th>losses</th><th>draws</th><th>recent win rate</th><th>PFSP weight</th></tr>` +

// ---- tabs of a run's (or a dataset's) page: the one shown stays when another run is opened ---------
try { ui.tabs = JSON.parse(localStorage.getItem("tabs") || "{}"); } catch (e) { ui.tabs = {}; }
(() => { const t = parseUrl().q.get("tab"); if (t) ui.tabs.run = ui.tabs.bc = ui.tabs.collect = ui.tabs.fullbc = t; })();
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

      `<button class="tab ${id === cur ? "on" : ""}" data-tab="${id}" id="tab-${id}">${title}<span class="count" style="display:none"></span></button>`).join("")}</div>` +
    (kind === "run" ? `<div class="legend" id="legend"></div><div class="zoomnote" id="zoomnote"></div>` : "") +
    tabs.map(([id, , html, charts]) => `<div class="pane" data-pane="${id}"${charts ? " data-charts" : ""}${id === cur ? "" : ` style="display:none"`}>${html}</div>`).join("");
}
function setupTabs(kind) {

function showTab(kind, id, quiet) {

  try { localStorage.setItem("tabs", JSON.stringify(ui.tabs)); } catch (e) {}
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  let charts = false;
  document.querySelectorAll(".pane").forEach(p => {
    const show = p.dataset.pane === id; p.style.display = show ? "" : "none";

  if (id === "replays" && state.data[state.selected]) renderReplays(state.data[state.selected]);  // (its viewer: now)

}
// a tab's count (e.g. evaluations); `keep`: shown also at zero (else the tab hides)
function setTabCount(id, n, keep) {
  const b = document.getElementById("tab-" + id); if (!b) return;
  const c = b.querySelector(".count");
  c.textContent = n; c.style.display = n ? "" : "none";
  b.style.display = n || keep ? "" : "none";
  if (!n && !keep && b.classList.contains("on")) showTab(document.querySelector(".tabs").dataset.kind, "overview");
}

// ---- replays: game videos and trajectory renders, one player and the episodes beside it ------------
ui.replay = { kind: "video", outcome: "all", file: null };
const outcomeText = o => o > 0 ? "win" : o < 0 ? "loss" : "tie";
function renderReplays(d) {
  const el = document.getElementById("media"); if (!el) return;
  const media = d.media || [], run = d.info.name;
  const count = k => media.filter(m => m.kind === k).length;
  setTabCount("replays", media.length, true);
  if (!count(ui.replay.kind) && media.length) ui.replay.kind = count("video") ? "video" : "render";
  const want = m => ui.replay.outcome === "all" || outcomeText(m.outcome) === ui.replay.outcome;
  const list = media.filter(m => m.kind === ui.replay.kind && want(m));
  if (el.dataset.run !== run) {  // the page's frame, once per run
    el.dataset.run = run; el.dataset.list = ""; el.dataset.viewer = "";
    el.innerHTML = `<div class="rp-top">
        <div class="seg" id="rp-kind"><button data-k="video">Game videos<span class="n"></span></button><button data-k="render">Trajectory renders<span class="n"></span></button></div>
        <div class="seg" id="rp-out"><button data-o="all">all</button><button data-o="win">wins</button><button data-o="loss">losses</button><button data-o="tie">ties</button></div>
        <span id="rp-hint"></span></div>
      <div class="replays"><div><div class="viewer" id="rp-viewer"></div><div id="rp-info"></div></div><div class="playlist" id="rp-list"></div></div>`;
    el.querySelectorAll("#rp-kind button").forEach(b => b.onclick = () => { ui.replay.kind = b.dataset.k; ui.replay.file = null; renderReplays(d); });
    el.querySelectorAll("#rp-out button").forEach(b => b.onclick = () => { ui.replay.outcome = b.dataset.o; renderReplays(d); });
  }
  el.querySelectorAll("#rp-kind button").forEach(b => {
    const n = count(b.dataset.k); b.querySelector(".n").textContent = n; b.disabled = !n; b.classList.toggle("on", b.dataset.k === ui.replay.kind); });
  el.querySelectorAll("#rp-out button").forEach(b => b.classList.toggle("on", b.dataset.o === ui.replay.outcome));
  document.getElementById("rp-hint").textContent = d.replay_hint ? d.replay_hint : ui.replay.kind === "video"
    ? `game footage of game 0, every ${d.info.args?.video_every || "N"} episodes: the policy's view beside it`
    : `the units' positions and hit points, every ${d.info.args?.record_every || "N"} episodes of game 0`;
  const cur = list.find(m => m.file === ui.replay.file) || list[0];
  const listKey = list.map(m => m.file + (m.info ? "+" : "")).join("|");
  const box = document.getElementById("rp-list");
  if (el.dataset.list !== listKey) {  // rebuilt only when the episodes change (keeps the scroll)
    el.dataset.list = listKey;
    box.innerHTML = list.map(m => `<div class="it" data-file="${esc(m.file)}">
        <span class="ep">${m.title ? esc(m.title) : `episode ${m.episode}`}</span><span class="${m.result ? "" : m.outcome > 0 ? "win" : m.outcome < 0 ? "loss" : ""}">${m.result ? esc(m.result) : outcomeText(m.outcome)}</span>
        <span class="sub">${m.sub ? esc(m.sub) : `return ${fmt(m.return, 2)}${m.value0 != null ? ` · V(s₀) ${fmt(m.value0, 2)}` : ""}`}</span><span class="sub">${m.time ? ago(m.time) : ""}</span>${videoTags(m.info)}</div>`).join("")
      || `<div class="none" style="padding:20px;color:var(--muted)">none${ui.replay.outcome !== "all" ? " with this outcome" : ""}</div>`;
    box.querySelectorAll(".it").forEach(it => it.onclick = () => { ui.replay.file = it.dataset.file; renderReplays(d); });
  }
  box.querySelectorAll(".it").forEach(it => it.classList.toggle("on", !!cur && it.dataset.file === cur.file));
  const viewer = document.getElementById("rp-viewer"), infoBox = document.getElementById("rp-info");
  if (infoBox) infoBox.innerHTML = cur && cur.kind === "video" && "info" in cur ? videoInfoHtml(cur.info) : "";
  if (!cur) {
    if (el.dataset.viewer !== "none") {
