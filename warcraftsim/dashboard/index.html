      viewer.innerHTML = `<div class="none">${media.length ? "No episode matches." : `No replays yet: trajectory renders come every ${d.info.args?.record_every || "N"} episodes of game 0, game videos every ${d.info.args?.video_every || "N"} (rendered in the background).`}</div>`;
    }
    return;
  }
  if (el.dataset.viewer === cur.file) return;  // playing: left alone
  // its tab hidden: nothing loaded (the viewer's video streamed its 60-80 MB on every run's page, a phone's
  // too); showTab builds it when the tab is shown
  if (el.offsetParent === null) return;
  el.dataset.viewer = cur.file; ui.replay.file = cur.file;
  const src = `/files/${encodeURIComponent(run).replace(/%2F/g, "/")}/${cur.file}`;
  const cal = cur.value0 != null ? ` · predicted V(s₀) ${fmt(cur.value0, 2)}, discounted return ${fmt(cur.return0, 2)}` : "";
  viewer.innerHTML = (cur.kind === "video"
      ? `<video src="${src}" controls muted loop playsinline preload="metadata"${matchMedia("(max-width: 760px)").matches ? "" : " autoplay"}></video>`
      : `<iframe src="${src}#autoplay" title="trajectory"></iframe>`) +
    `<div class="cap"><span>${cur.title ? esc(cur.title) : `episode ${cur.episode}`} · <span class="${cur.result ? "" : cur.outcome > 0 ? "win" : cur.outcome < 0 ? "loss" : ""}">${cur.result ? esc(cur.result) : outcomeText(cur.outcome)}</span> · ${cur.sub ? esc(cur.sub) : `return ${fmt(cur.return, 2)}`}${cal}${cur.time ? ` · ${ago(cur.time)}` : ""}</span>
      <a href="${src}" target="_blank">open ↗</a></div>`;
}

// ---- observation and action spaces ----------------------------------------------------------------
function spacesHtml(sp) {
  if (!sp) return `<div class="empty">not recorded, and the task no longer exists</div>`;
  const o = sp.observation || {}, a = sp.actions || {};
  let at = 0;
  const blocks = (o.blocks || []).map(b => {
    const n = b.rows * b.features.length, from = at; at += n;
    const feats = b.features.length > 1
      ? `<details><summary>${b.features.length} features per row</summary><ol start="0">${b.features.map(f => `<li>${esc(f)}</li>`).join("")}</ol></details>`
      : esc(b.features[0] || "");
    return `<tr><td>${esc(b.name)}</td><td>${b.rows} × ${b.features.length}</td><td>${typeof o.size === "string" ? "–" : `${from}–${from + n - 1}`}</td><td>${feats}</td></tr>`;
  }).join("");
  const heads = (a.heads || []).map(h => `<tr><td><b>${esc(h.name)}</b></td><td>${h.size}</td>
      <td><div class="chips">${h.options.map(x => `<span>${esc(x)}</span>`).join("")}</div></td>
      <td>${h.used_by && h.used_by.length ? `when the order is ${h.used_by.map(esc).join(" or ")}` : "always"}</td></tr>`).join("");
  const warn = sp.from_current_code ? `<div class="${sp.sizes_match ? "" : "warn"}" style="margin-bottom:8px;font-size:12px;color:var(--muted)">
      Not recorded with this run (it predates that): described by the current code for its task${sp.sizes_match ? "; the sizes match the run's" : ". <span class='warn'>The sizes differ from the run's: the task changed since.</span>"}</div>` : "";
  return `${warn}<div class="spaces">
    <div class="panel"><h3>Observation<span>${typeof o.size === "string" ? `${esc(o.size)} values (a set of entities)` : `${o.size} floats per agent`}${typeof sp.agents === "string" && sp.agents ? ` · agents: ${esc(sp.agents)}` : sp.agents > 1 ? ` · ${sp.agents} agents per game` : ""}</span></h3>
      ${blocks ? `<table><tr><th>block</th><th>shape</th><th>index</th><th>features</th></tr>${blocks}</table>` : `<div style="color:var(--muted)">a flat vector (no layout recorded)</div>`}</div>
    <div class="panel"><h3>Actions<span>${typeof a.units === "string" ? `per own unit (${esc(a.units)}): ${(a.heads || []).length} heads` : `${a.units > 1 ? `${a.units} units × ` : ""}${(a.heads || []).length} heads = ${(a.sizes || []).length} discrete heads`}</span></h3>
      <table><tr><th>head (per unit)</th><th>size</th><th>choices</th><th>counts</th></tr>${heads}</table>
      <dl class="facts" style="margin-top:10px"><dt>Masks</dt><dd>${esc(a.masks || "None.")}</dd>
        <dt>Reward</dt><dd>${esc(sp.reward || "")}${sp.reward_scale && sp.reward_scale !== 1 ? ` <span style="color:var(--muted)">(× ${sp.reward_scale} for the trainer)</span>` : ""}</dd></dl></div>
  </div>`;
}

// ---- evaluations (bc eval rows of a run's or a dataset's checkpoints) -------------------------------
function renderEvals(evals) {

    evals.slice().reverse().map(e => {
      const mode = [e.greedy ? "greedy" : "sampled", e.script_casts ? "scripted casts" : "", ...(e.forbid || []).map(k => `no ${k}`)].filter(Boolean).join(", ");
      const ck = e.steps != null ? `${fmt(e.steps, 0)} steps` : (e.checkpoint || "").split("/").pop() + (e.fit_epochs ? ` (fit: ${e.fit_epochs} epochs)` : "");
      const types = Object.entries(e.by_type || {}).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])

      return `<tr title="${esc(e.command || "")}"><td>${new Date(e.time * 1000).toLocaleString()}</td><td>${esc(ck)}</td><td>${esc(mode)}</td>

        <td>${e.draw_rate != null ? (100 * e.draw_rate).toFixed(0) + "%" : "–"}</td>

// ---- a behavior cloning dataset's page (run bc/<name>) ------------------------------------------
const KIND_COLORS = { noop: "#8795a3", stop: "#e0c33a", hold: "#c69026", retreat: "#b083f0", move: "#539bf5",
                      attack_move: "#39c5cf", attack: "#e5534b", cast: "#f56ed2" };
function fitPoints(d, key) {  // key: a path into the fit rows (acc.first, choices.retreat.recall)
  return (d.fit || []).map(r => [r.epoch, key.split(".").reduce((o, k) => o == null ? o : o[k], r)]).filter(p => typeof p[1] === "number");
}
function renderBC(d) {
  const info = d.info, s = d.summary || {}, fit = d.fit || [], last = fit[fit.length - 1] || {};
  const main = document.getElementById("main");
  const kinds = Object.keys(last.choices || {});
  const FIT = (key, name, color) => ["fit", key, name, color];
  const noFit = (info.fit || {}).finished && !fit.length ? "no fit recorded (fitted before fits were logged)"
    : (info.status || "").startsWith("fitting") ? "fitting: the first epoch is on its way" : "not fitted yet";
  const sections = [
    ["The fit, per epoch (on the validation episodes)", [
      ["b-loss", "Loss", "cross-entropy + value", [FIT("train_loss", "train", "#e0a33a"), FIT("val_loss", "validation", "#539bf5")], { axis: "epoch", empty: noFit }],
      ["b-acc", "Accuracy", "choices the network's most likely action matches", [FIT("acc.first", "unit order", "#4cc38a"), FIT("acc.detail1", "direction", "#539bf5"),
        FIT("acc.detail2", "target", "#e5534b"), FIT("acc.detail3", "ability", "#f56ed2")], { axis: "epoch", ymin: 0, ymax: 1, empty: noFit }],
      ["b-rec", "Recall per order", "share of the script's choices it predicts", kinds.map(k => FIT(`choices.${k}.recall`, k, KIND_COLORS[k] || "#39c5cf")), { axis: "epoch", ymin: 0, ymax: 1, empty: noFit }],
      ["b-prec", "Precision per order", "share of its predictions the script made", kinds.map(k => FIT(`choices.${k}.precision`, k, KIND_COLORS[k] || "#39c5cf")), { axis: "epoch", ymin: 0, ymax: 1, empty: noFit }],
      ["b-val", "Value error", "mean squared error on the discounted return", [FIT("value_mse", "value MSE", "#b083f0")], { axis: "epoch", ymin: 0, empty: noFit }],
    ], "fit", "Fit"],
    ["Demonstrations (the script's episodes)", [
      ["b-win", "Outcomes", "win · draw · loss", [EP("win_rate", "win", "#4cc38a"), EP("draw_rate", "draw", "#e0a33a"), EP("loss_rate", "loss", "#e5534b")], { axis: "episode", ymin: 0, ymax: 1 }],
      ["b-act", "Action mix", "share of unit-steps", ["noop", "stop", "hold", "retreat", "move", "attack_move", "attack", "cast"].map(k => EP("act_" + k, k, KIND_COLORS[k])), { axis: "episode", ymin: 0, ymax: 1 }],
      ["b-cmb", "Combat", "per episode", [EP("combat_dealt", "damage dealt", "#4cc38a"), EP("combat_taken", "damage taken", "#e5534b")], { axis: "episode", ymin: 0, ymax: 1, empty: "not recorded for this dataset (collected before combat was logged)" }],
      ["b-len", "Episode length", "steps", [EP("length", "steps", "#539bf5")], { axis: "episode", ymin: 0 }],
    ], "demos", "Demonstrations"],
  ];
  const sig = info.name + "|" + kinds.join(",");

const RACES = ["human", "orc", "undead", "nightelf"];
function chartBox([id, title, sub]) {

function overviewHtml(info, what) {
  return `<div class="cards" id="cards"></div>
    <div class="about">
      <div class="panel"><h3>Notes<span id="notestate"></span></h3>

function setCharts(defs, pointsOf) {
  for (const [id, , , series] of defs) {
    const c = ui.charts[id]; if (!c) continue;
    c.marks = [];
    c.series = series.map(([key, name, color]) => ({ name, color, run: 0, runName: "", dash: [], points: pointsOf(id, key),
                                                      raw: !!c.opts.raw, dots: !!c.opts.dots }));
    drawChart(id);
  }
}
function matrixHtml(m, caption) {
  const cell = ([w, t, l]) => { const n = w + t + l; return n ? `<td class="w" title="${w} wins, ${t} ties, ${l} losses">${(100 * w / n).toFixed(0)}% <small style="color:var(--muted)">${n}</small></td>` : `<td style="color:var(--muted)">–</td>`; };
  const total = a => RACES.reduce((acc, b) => b === a ? acc : acc.map((v, i) => v + m[a][b][i]), [0, 0, 0]);
  return `<div style="color:var(--muted);margin-bottom:8px">${caption}</div><table class="runs matrix"><tr><th></th>${RACES.map(r => `<th>vs ${r}</th>`).join("")}<th>vs other races</th></tr>` +
    RACES.map(a => `<tr><th>${a}</th>${RACES.map(b => cell(m[a][b])).join("")}${cell(total(a))}</tr>`).join("") + `</table>`;

    : `<div style="color:var(--muted)">none yet</div>`;
  bindGo(ch);
  const cmd = info.command || `python3 -m warcraftsim.fullgame.bc ` + Object.entries(a).filter(([k, v]) => v !== "" && v !== "None" && v !== "False" && k !== "runs" && k !== "device")

}

// charts that don't apply to a run are hidden (opts.only: "micro" / "fullgame"; opts.hideEmpty: a

function chartVisibility(d) {

// whole-game self-play: what the learner and its opponent make per game, by kind of game and race
// ---- the System tab's bottleneck view (GET /api/runs/<run>: "system", dashboard/server.py _system) ----
const PART_COLORS = { "games": "#4cc38a", "games (other threads)": "#2e7d5b", "Wine": "#39c5cf", "Xvfb": "#2a8f97",
                      "actors": "#539bf5", "learner": "#b083f0", "video renderer": "#e0a33a", "outside the run": "#e5534b",
                      "ended processes": "#8795a3", "unattributed": "#8795a3", "idle": "#26303b" };
function svgStackedBar(parts, total, W, H) {  // parts: [[label, value, color]]: one bar, proportions of total
  let x = 0;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px;display:block">` +
    parts.map(([label, v, c]) => { const w = W * v / Math.max(total, 1e-9), r = `<rect x="${x}" y="0" width="${Math.max(0, w)}" height="${H}" fill="${c}"><title>${esc(label)}: ${v.toFixed(2)}</title></rect>`; x += w; return r; }).join("") + `</svg>`;
}
function legendHtml(parts, unit) {
  return `<div class="blegend">${parts.map(([label, v, c]) => `<span><i style="background:${c}"></i>${esc(label)} <b>${v.toFixed(1)}</b>${unit}</span>`).join("")}</div>`;
}
// a stacked chart drawn at the box's own width: an area over x (kind "area") or a bar per x ("bars"); axes with their
// titles; a cursor and a tooltip where the pointer is. opts: { x: [..], series: [[label, color, values]], xLabel, yLabel,
// ymax, xfmt, tip(i), height }
function drawStack(box, opts) {
  const n = opts.x.length;
  if (!box) return;
  if (n < 2) { box.innerHTML = `<div class="sub">not enough samples yet</div>`; return; }
  const W = Math.max(320, box.clientWidth), H = opts.height || 160, L = 46, R = 10, T = 8, B = 34, pw = W - L - R, ph = H - T - B;
  const tot = opts.x.map((_, i) => opts.series.reduce((a, sr) => a + (sr[2][i] || 0), 0));
  const ymax = opts.ymax || Math.max(1e-9, ...tot) * 1.08, x0 = opts.x[0], x1 = opts.x[n - 1];
  const X = opts.kind === "bars" ? (i => L + (i + 0.5) * pw / n) : (i => L + (opts.x[i] - x0) / Math.max(x1 - x0, 1e-9) * pw);
  const Y = v => T + ph - v / ymax * ph, bw = pw / n, out = [];
  const nice = m => { const e = Math.pow(10, Math.floor(Math.log10(m))), f = m / e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e; };
  const ys = nice(ymax / 4);
  for (let v = 0; v <= ymax + 1e-9; v += ys)
    out.push(`<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${+v.toFixed(2)}</text>`);
  for (let k = 0; k <= 4; k++) {
    const i = Math.round(k / 4 * (n - 1));
    out.push(`<text x="${X(i)}" y="${T + ph + 15}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${esc(opts.xfmt(opts.x[i]))}</text>`);
  }
  const base = new Array(n).fill(0);
  for (const [label, color, vals] of opts.series) {
    if (opts.kind === "bars") {
      opts.x.forEach((_, i) => { const v = vals[i] || 0; if (v > 0) out.push(`<rect x="${(X(i) - bw / 2 + 0.5).toFixed(1)}" y="${Y(base[i] + v).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${(Y(base[i]) - Y(base[i] + v)).toFixed(1)}" fill="${color}"/>`); base[i] += v; });
    } else {
      const top = base.map((b, i) => b + (vals[i] || 0));
      const pts = opts.x.map((_, i) => `${X(i).toFixed(1)},${Y(top[i]).toFixed(1)}`).concat(opts.x.map((_, j) => n - 1 - j).map(i => `${X(i).toFixed(1)},${Y(base[i]).toFixed(1)}`));
      out.push(`<polygon points="${pts.join(" ")}" fill="${color}" opacity="0.92"/>`);
      top.forEach((v, i) => { base[i] = v; });
    }
  }
  out.push(`<line x1="${L}" x2="${L}" y1="${T}" y2="${T + ph}" stroke="var(--muted)" stroke-width="1"/><line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--muted)" stroke-width="1"/>`);
  out.push(`<text x="${L + pw / 2}" y="${H - 3}" text-anchor="middle" font-size="11.5" fill="var(--text)">${esc(opts.xLabel)}</text>`);
  out.push(`<text transform="translate(12 ${T + ph / 2}) rotate(-90)" text-anchor="middle" font-size="11.5" fill="var(--text)">${esc(opts.yLabel)}</text>`);
  out.push(`<line class="cur" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--text)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`);
  box.innerHTML = `<svg width="${W}" height="${H}" style="display:block;touch-action:pan-y">${out.join("")}</svg>`;
  const svg = box.firstChild, cur = svg.querySelector(".cur");
  let tip = document.getElementById("ctip");
  if (!tip) { tip = document.createElement("div"); tip.id = "ctip"; tip.className = "ctip"; document.body.appendChild(tip); }
  const at = ev => {  // the sample under the pointer
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left;
    if (opts.kind === "bars") return Math.max(0, Math.min(n - 1, Math.floor((px - L) / bw)));
    let best = 0, dist = Infinity;
    for (let i = 0; i < n; i++) { const dd = Math.abs(X(i) - px); if (dd < dist) { dist = dd; best = i; } }
    return best;
  };
  svg.onpointermove = ev => {
    const i = at(ev);
    cur.setAttribute("x1", X(i)); cur.setAttribute("x2", X(i)); cur.setAttribute("visibility", "visible");
    tip.innerHTML = opts.tip(i); tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = (ev.clientX + 14 + tw > window.innerWidth ? ev.clientX - 14 - tw : ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 12) + "px";
  };
  svg.onpointerleave = () => { cur.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
}

function renderBottleneck(d) {
  const el = document.getElementById("bottleneck"), S = d.system;
  if (!el) return;
  if (!S || !(S.cpu.length || S.cycle.length)) { el.innerHTML = ""; return; }
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
  const last = S.cpu[S.cpu.length - 1], recent = S.cpu.slice(-6);  // (the last ~3 minutes)
  const parts = Object.keys(PART_COLORS).filter(k => k !== "idle");
  const avg = k => mean(recent.map(r => (r.cores || {})[k] || 0));
  const ncpu = last ? last.ncpu : 0, idle = mean(recent.map(r => r.idle || 0)), busy = ncpu - idle;
  const cyc = S.cycle.slice(-20), wait = mean(cyc.map(c => c.wait || 0)), upd = mean(cyc.map(c => c.train + c.noise));
  const waitShare = wait / Math.max(wait + upd, 1e-9);
  const inf = S.infer.slice(-6), latIdle = mean(inf.map(r => r.lat_idle)), latUpd = mean(inf.map(r => r.lat_update)),
        share = mean(inf.map(r => r.rounds_update_share)), lat = latIdle * (1 - share) + latUpd * share;
  const eps = (d.recent_episodes || []).filter(e => e.step_game_ms != null && e.step_wall_ms != null && !e.host);  // (this machine's)
  const game = mean(eps.map(e => e.step_game_ms)), stepWait = mean(eps.map(e => e.step_wall_ms - e.step_game_ms));
  const gpu = mean(recent.map(r => r.gpu_util).filter(v => v != null));
  let verdict;
  if (ncpu && busy / ncpu > 0.9 && waitShare > 0.25) verdict = `<b>CPU-bound.</b> ${busy.toFixed(1)} of ${ncpu} threads busy; the learner waits ${(100 * waitShare).toFixed(0)}% of its cycle for games.`;
  else if (waitShare < 0.15) verdict = `<b>Learner-bound.</b> It waits for games only ${(100 * waitShare).toFixed(0)}% of its cycle: the games wait for its queue.`;
  else if (Number.isFinite(lat) && Number.isFinite(stepWait) && lat > 0.6 * stepWait) verdict = `<b>Inference-bound.</b> A game step waits ${stepWait.toFixed(1)} ms for its orders, ~${lat.toFixed(1)} ms of it for the network.`;
  else verdict = `<b>No single limit.</b> CPU ${ncpu ? (100 * busy / ncpu).toFixed(0) : "–"}% busy, the learner waits ${(100 * waitShare).toFixed(0)}% of its cycle.`;
  const now = parts.map(k => [k, avg(k), PART_COLORS[k]]).filter(p => p[1] > 0.005).concat([["idle", Math.max(0, idle), PART_COLORS.idle]]);
  const stepParts = Number.isFinite(game) ? [["simulating", game, "#4cc38a"], ["inference round", Math.min(lat || 0, stepWait), "#b083f0"],
                                             ["actor's Python and its turn", Math.max(0, stepWait - (lat || 0)), "#539bf5"]] : [];
  el.innerHTML = `<div class="bneck">
    <div class="bverdict">${verdict} <span class="sub">GPU ${Number.isFinite(gpu) ? gpu.toFixed(0) + "%" : "–"} busy · inference rounds ${Number.isFinite(latIdle) ? latIdle.toFixed(1) : "–"} ms with the learner idle, ${Number.isFinite(latUpd) ? latUpd.toFixed(1) : "–"} ms during its updates</span></div>
    <div class="bgrid">
      <div class="panel"><h3>Where the CPU goes now <span class="sub">${ncpu} threads, the last ~3 minutes</span></h3>${svgStackedBar(now, ncpu, 600, 22)}${legendHtml(now, "")}</div>
      <div class="panel"><h3>A game step's wall time <span class="sub">the last ${eps.length} games, ms</span></h3>${stepParts.length ? svgStackedBar(stepParts, stepParts.reduce((a, p) => a + p[1], 0), 600, 22) + legendHtml(stepParts, " ms") : `<div class="sub">recorded by games since 2026-10-24 15:00</div>`}</div>
      <div class="panel wide"><h3>The CPU over the run <span class="sub">threads by part, stacked</span></h3><div id="bn-cpu"></div>
        ${legendHtml(now, "")}</div>
      <div class="panel wide"><h3>The learner's last ${S.cycle.length} updates <span class="sub">waiting for games, the update, the noise measurement</span></h3>
        <div id="bn-cycle"></div>
        ${legendHtml([["waiting for games", wait, "#3a4654"], ["update", mean(cyc.map(c => c.train)), "#4cc38a"], ["noise measurement", mean(cyc.map(c => c.noise)), "#e0a33a"]], " s (mean of the last 20)")}</div>
    </div></div>`;
  const keys = [...parts, "idle"].filter(k => S.cpu.some(r => (k === "idle" ? r.idle : (r.cores || {})[k]) > 0.005));
  const val = (r, k) => k === "idle" ? (r.idle || 0) : ((r.cores || {})[k] || 0);
  const when = t => t ? new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  drawStack(document.getElementById("bn-cpu"), {
    kind: "area", x: S.cpu.map(r => r.steps), series: keys.map(k => [k, PART_COLORS[k], S.cpu.map(r => val(r, k))]),
    ymax: ncpu || undefined, xLabel: "agent steps", yLabel: "threads", xfmt: v => fmt(v, 0), height: 170,
    tip: i => { const r = S.cpu[i]; return `<b>${fmt(r.steps, 0)} steps</b> · ${when(r.time)}<br>` + keys.slice().reverse().map(k =>
      `<i style="background:${PART_COLORS[k]}"></i>${esc(k)} <b>${val(r, k).toFixed(1)}</b>`).join("<br>") + (r.gpu_util != null ? `<br>GPU ${r.gpu_util.toFixed(0)}% · ${r.gpu_watts != null ? r.gpu_watts.toFixed(0) + " W" : ""}` : ""); },
  });
  const cy = S.cycle, cyParts = [["waiting for games", "#3a4654", c => c.wait || 0], ["update", "#4cc38a", c => c.train], ["noise measurement", "#e0a33a", c => c.noise]];
  drawStack(document.getElementById("bn-cycle"), {
    kind: "bars", x: cy.map(c => c.epoch), series: cyParts.map(([lab, col, f]) => [lab, col, cy.map(f)]),
    xLabel: "update", yLabel: "seconds", xfmt: v => String(v), height: 150,
    tip: i => { const c = cy[i]; return `<b>update ${c.epoch}</b> · ${when(c.time)}<br>` + cyParts.slice().reverse().map(([lab, col, f]) =>
      `<i style="background:${col}"></i>${lab} <b>${f(c).toFixed(2)} s</b>`).join("<br>") + `<br>${(8192 / Math.max((c.wait || 0) + c.train + c.noise, 1e-9)).toFixed(0)} steps/s`; },
  });
}

// ---- whole-game self-play: win rates by matchup (the learner's race by the opponent's) ------------
const MU_NAMES = { human: "human", orc: "orc", undead: "undead", nightelf: "night elf" };
try { ui.mu = JSON.parse(localStorage.getItem("matchups") || "{}"); } catch (e) { ui.mu = {}; }
function muColor(p, n) {  // red below 50%, green above; stronger the further from even (faint for few games)
  const a = (0.12 + 0.6 * Math.min(1, Math.abs(p - 0.5) * 2)) * Math.min(1, 0.35 + n / 30);
  return p >= 0.5 ? `rgba(76,195,138,${a.toFixed(3)})` : `rgba(229,83,75,${a.toFixed(3)})`;
}
function muCell([w, t, l], cls = "", extra = "") {
  const n = w + t + l;
  if (!n) return `<td class="none ${cls}">–</td>`;
  const p = (w + 0.5 * t) / n;  // (a tie counts half, as the curriculum and the league count it)
  return `<td class="${cls}" style="background:${muColor(p, n)}" title="${w} won, ${t} tied, ${l} lost${extra}">${(100 * w / n).toFixed(0)}%<small>${n} games</small></td>`;
}
function muTable(m, note) {  // rows: the learner's race; columns: the opponent's
  const sum = cells => cells.reduce((a, c) => a.map((v, i) => v + c[i]), [0, 0, 0]);
  const col = b => sum(RACES.map(a => m[a][b])), row = a => sum(RACES.map(b => m[a][b]));
  return `<table class="mu"><tr><th></th>${RACES.map(b => `<th>vs ${MU_NAMES[b]}</th>`).join("")}<th>all</th></tr>` +
    RACES.map(a => `<tr><th class="r">${MU_NAMES[a]}</th>${RACES.map(b => muCell(m[a][b], "", note ? note(a, b) : "")).join("")}${muCell(row(a), "tot")}</tr>`).join("") +
    `<tr><th class="r">all</th>${RACES.map(b => muCell(col(b), "tot")).join("")}${muCell(sum(RACES.map(row)), "tot")}</tr></table>`;
}
function renderMatchups(d) {
  const tab = document.getElementById("tab-matchups"), box = document.getElementById("matchups");
  if (tab) tab.style.display = d.matchups ? "" : "none";
  if (!box || !d.matchups) return;
  const M = d.matchups, win = ui.mu.window || "recent", diff = ui.mu.diff || "";
  const last = d.train && d.train.length ? d.train[d.train.length - 1] : {};
  const pct = v => (100 * v).toFixed(0) + "%";
  // the taxes in force now (the last trainer line): between races, and on the AI per matchup
  const balance = (a, b) => { const k = `balance/${a}/${b} tax`, k2 = `balance/${b}/${a} tax`;
    const v = last[k] !== undefined ? last[k] : last[k2] !== undefined ? -last[k2] : undefined;
    return v ? ` · now ${v > 0 ? MU_NAMES[a] : MU_NAMES[b]}'s income taxed ${pct(Math.abs(v))}` : ""; };
  const diffs = ["easy", "normal", "insane"].filter(x => Object.keys(last).some(k => k.startsWith(`curriculum/ai-${x} `)));
  const aiTax = (a, b) => diffs.map(x => last[`curriculum/ai-${x} ${a}/${b} level`] ?? last[`curriculum/ai-${x} ${a} level`])
    .some(v => v) ? ` · the AI's curriculum level now: ${diffs.map(x => `${x} ${(last[`curriculum/ai-${x} ${a}/${b} level`] ?? last[`curriculum/ai-${x} ${a} level`] ?? 0).toFixed(2)}`).join(", ")}` : "";
  const real = M["real" + (diff && M["real " + diff] ? " " + diff : "")];
  const evals = Object.keys(M).filter(k => k.startsWith("eval ")).sort((a, b) => (a === "eval current" ? -1 : b === "eval current" ? 1 : a.localeCompare(b)));
  const panels = [
    ...evals.map(k => [M[k], k === "eval current" ? "Evaluation games: the current policy" : `Evaluation games: ${k.slice(5)}`,
      k === "eval current" ? "the real game against the untaxed AI, nothing trained on them: the run's yardstick"
        : "the same matchups by a fixed checkpoint (--eval-checkpoints): the head to head", null]),
    [real, `Training games against the untaxed AI${diff && M["real " + diff] ? ` (${diff})` : ""}`, "no tax, no handicap (--real-share of the AI games); the learner trains on them", null],
    [M.self, "Against itself", "both sides the learner, so the races alone differ (each game counted from both sides); the stronger race's income taxed", balance],
    [M.curriculum, "Curriculum games against the built-in AI", "the AI's income taxed by the matchup's curriculum level", aiTax],
    [M.past, "Against past snapshots", "the learner's race by the snapshot's (taxed between races as against itself)", null],
  ].filter(p => p[0]);
  const seg = (key, opts, cur) => `<span class="seg">${opts.map(([v, label]) => `<button data-mu="${key}" data-v="${v}" class="${v === cur ? "on" : ""}">${label}</button>`).join("")}</span>`;
  box.innerHTML = `<div class="mu-bar">${seg("window", [["recent", "recent games"], ["all", "whole run"]], win)}
      ${seg("diff", [["", "every AI"], ...["easy", "normal", "insane"].filter(x => M["real " + x]).map(x => [x, x + " AI"])], diff)}

// ---- the Docs view: docs/*.md (GET /api/docs, /api/docs/<name>; POST saves) ---------------------
function mdInline(s) {  // escaped text -> inline markdown: code, images, links, bold, italics
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => `<img alt="${a}" src="${/^(https?:|\/)/.test(u) ? u : "/docs/" + u}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, u) => {
    const doc = u.match(/^(?:\.\.\/|\.\/|docs\/)?((?:reference\/|proposals\/|related\/)?[a-z0-9-]+)\.md(#.*)?$/);  // a link to another document: open it here
    return doc ? `<a href="/doc/${doc[1]}" data-doc="${doc[1]}">${txt}</a>` : `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, "$1<i>$2</i>")
       .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
}
function mdToHtml(text) {
  const lines = esc(text).split("\n"), out = [];
  let i = 0;
  const isTable = k => /^\s*\|.*\|\s*$/.test(lines[k] || "") && /^\s*\|[\s:|-]+\|\s*$/.test(lines[k + 1] || "");
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => mdInline(c.trim()));
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {  // a code block (```mermaid: a diagram)
      const lang = l.slice(3).trim(), body = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
      i++;
      out.push(lang === "mermaid" ? `<div class="mermaid">${body.join("\n")}</div>` : `<pre><code>${body.join("\n")}</code></pre>`);
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(i)) {
      const head = cells(lines[i]); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr>` + rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`);
      continue;
    }
    if (/^\s*([*-]|\d+\.)\s+/.test(l)) {  // a list, nested by indentation
      const stack = [];
      while (i < lines.length && (/^\s*([*-]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && stack.length))) {
        const m = lines[i].match(/^(\s*)([*-]|\d+\.)\s+(.*)$/);
        if (!m) { out.push(" " + mdInline(lines[i].trim())); i++; continue; }  // a list item's continued line
        const depth = m[1].length, tag = /\d/.test(m[2]) ? "ol" : "ul";
        while (stack.length && stack[stack.length - 1].depth > depth) out.push(`</li></${stack.pop().tag}>`);
        if (!stack.length || stack[stack.length - 1].depth < depth) { out.push(`<${tag}>`); stack.push({ depth, tag }); }
        else out.push("</li>");
        out.push(`<li>${mdInline(m[3])}`); i++;
      }
      while (stack.length) out.push(`</li></${stack.pop().tag}>`);
      continue;
    }
    if (/^&gt;\s?/.test(l)) {
      const body = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) body.push(lines[i++].replace(/^&gt;\s?/, ""));
      out.push(`<blockquote>${mdInline(body.join(" "))}</blockquote>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([*-]|\d+\.)\s+|&gt;)/.test(lines[i]) && !isTable(i)) para.push(lines[i++]);
    out.push(`<p>${mdInline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

ui.ratings = { data: null, kinds: { checkpoint: true, current: true, "+z": false, anchor: true }, min: 30, all: false, sort: "rating" };
// the table's order: the rating, either end of its 95% interval (a cautious or a hopeful ranking), games, last played
const RATING_SORTS = { rating: ["rating", p => p.rating], low: ["95% low end", p => p.rating - 1.96 * (p.se || 0)],
                       high: ["95% high end", p => p.rating + 1.96 * (p.se || 0)], games: ["games", p => p.games],
                       last: ["last played", p => p.last || 0] };
const RATING_KINDS = { checkpoint: ["a checkpoint", "#539bf5"], current: ["a run's policy, by the hour", "#4cc38a"],
                       "+z": ["with a target strategy", "#e0a33a"], anchor: ["the insane AI (1500)", "#d7dee6"] };
// each policy's rank by rating among `players` and its 95% interval: ratings drawn from their estimates (normal, mean the
// rating, sd its standard error, independently: the fit's covariances left out) 2,000 times, each time ranked; cached
function ratingRanks(players) {

  let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;

      });
      g.addEventListener("mouseleave", () => { tip._hide = setTimeout(() => { tip.style.display = "none"; }, 250); });
      g.addEventListener("click", () => { if (!pz.moved()) openRun(run); });  // (not the end of a drag)
    });
  });
}
// pan and zoom for a drawing in a box: drag, the wheel (around the cursor), pinch, buttons, keys, double-click to fit
function panZoom(box, inner, start = null, onChange = null) {
  const svg = inner.querySelector("svg"); if (!svg) return { moved: () => false };
  const vb = svg.viewBox && svg.viewBox.baseVal, w = vb && vb.width || svg.getBBox().width, h = vb && vb.height || svg.getBBox().height;
  svg.setAttribute("width", w); svg.setAttribute("height", h); svg.style.maxWidth = "none";
  let s = 1, x = 0, y = 0, drag = null, moved = false;
  const pct = box.querySelector(".pct");
  const apply = () => { inner.style.transform = `translate(${x}px, ${y}px) scale(${s})`; if (pct) pct.textContent = Math.round(100 * s) + "%";
                        if (onChange) onChange({ s, x, y }); };
  const zoomAt = (f, cx, cy) => { const n = Math.min(4, Math.max(0.1, s * f)); x = cx - (cx - x) * n / s; y = cy - (cy - y) * n / s; s = n; apply(); };
  const center = () => { const r = box.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  const fit = () => { const r = box.getBoundingClientRect(); s = Math.min(4, Math.max(0.1, Math.min((r.width - 24) / w, (r.height - 24) / h)));
                      x = (r.width - w * s) / 2; y = (r.height - h * s) / 2; apply(); };
  box.addEventListener("wheel", ev => { ev.preventDefault(); const r = box.getBoundingClientRect();
    zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
  const pointers = new Map();
  box.addEventListener("pointerdown", ev => {
    if (ev.target.closest(".zoom")) return;
    pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
    drag = { x0: ev.clientX, y0: ev.clientY, x, y, dist: null }; moved = false; box.classList.add("dragging");
  });
  window.addEventListener("pointermove", ev => {
    if (!drag || !pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pointers.size === 2) {  // pinch
      const [[ax, ay], [bx, by]] = [...pointers.values()], d = Math.hypot(ax - bx, ay - by), r = box.getBoundingClientRect();
      if (drag.dist) zoomAt(d / drag.dist, (ax + bx) / 2 - r.left, (ay + by) / 2 - r.top);
      drag.dist = d; moved = true; return;
    }
    const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    x = drag.x + dx; y = drag.y + dy; apply();
  });
  const up = ev => { pointers.delete(ev.pointerId); if (!pointers.size) { drag = null; box.classList.remove("dragging"); } };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  box.addEventListener("dblclick", ev => { if (!ev.target.closest(".zoom")) fit(); });
  box.querySelectorAll("button[data-z]").forEach(b => b.onclick = () => {
    const [cx, cy] = center();
    if (b.dataset.z === "in") zoomAt(1.25, cx, cy); else if (b.dataset.z === "out") zoomAt(0.8, cx, cy);
    else if (b.dataset.z === "fit") fit(); else { s = 1; x = 12; y = 12; apply(); }
  });
  box.tabIndex = 0;
  box.addEventListener("keydown", ev => {
    const [cx, cy] = center();
    if (ev.key === "+" || ev.key === "=") zoomAt(1.25, cx, cy); else if (ev.key === "-") zoomAt(0.8, cx, cy);
    else if (ev.key === "0") fit(); else if (ev.key === "1") { s = 1; x = 12; y = 12; apply(); }
    else if (ev.key.startsWith("Arrow")) { const d = 60; x += ev.key === "ArrowLeft" ? d : ev.key === "ArrowRight" ? -d : 0; y += ev.key === "ArrowUp" ? d : ev.key === "ArrowDown" ? -d : 0; apply(); }
    else return;
    ev.preventDefault();
  });
  // a phone: at a size to read (the graph's width at most the box's), at its end: the newest runs
  const readable = () => { const r = box.getBoundingClientRect(); s = Math.min(1, Math.max(0.4, (r.width - 24) / w));
                           x = w * s < r.width ? (r.width - w * s) / 2 : 12; y = h * s < r.height ? (r.height - h * s) / 2 : r.height - h * s - 12; apply(); };
  if (start) { ({ s, x, y } = start); apply(); } else if (matchMedia("(max-width: 760px)").matches) readable(); else fit();
  return { moved: () => moved };
}

function renderCheckpoints(d) {
  const el = document.getElementById("checkpoints"); if (!el) return;
  const cks = d.checkpoints || [];
  setTabCount("checkpoints", cks.length, false);
  const key = cks.map(c => c.file + c.time + JSON.stringify(c.league || "") + JSON.stringify(c.eval || "")).join("|");
  if (el.dataset.key === key) return;  // unchanged: keeps the scroll position
  el.dataset.key = key;
  const pct = v => v == null ? "–" : (100 * v).toFixed(0) + "%";
  const mb = b => b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : (b / 1e3).toFixed(0) + " kB";
  const base = `/files/${encodeURIComponent(d.info.name).replace(/%2F/g, "/")}/`;
  el.innerHTML = cks.length ? `<div style="color:var(--muted);margin-bottom:8px">${cks.length} saved, newest first. Paths are relative to the repository.</div>
    <table class="runs cks"><tr><th>checkpoint</th><th>saved</th><th>size</th><th></th><th></th></tr>` +
    cks.map((c, i) => `<tr><td><b>${c.steps != null ? fmt(c.steps, 0) + " steps" : esc(c.file)}</b>${i === 0 && c.steps != null ? ` <span class="tag">latest</span>` : ""}
        <div class="role">${c.role ? esc(c.role) + " · " : ""}<code>${esc(c.file)}</code></div></td>
      <td>${ago(c.time)}</td><td>${mb(c.bytes)}</td>
      <td>${c.league ? `<span class="tag lg" title="a league opponent: the learner's results against it">${esc(c.league.name)} · ${c.league.games || 0} games${c.league.win_rate != null ? ` · learner wins ${pct(c.league.win_rate)}` : ""}</span>` : ""}
        ${c.eval ? `<span class="tag ev" title="its latest evaluation">evaluated: ${pct(c.eval.win_rate)} of ${c.eval.episodes}${c.eval.n > 1 ? ` (${c.eval.n} evaluations)` : ""}</span>` : ""}</td>
      <td style="white-space:nowrap"><button data-copy="${esc(c.path)}" title="${esc(c.path)}">copy path</button><button data-copy="${esc(ckCommand(d, c))}" title="${esc(ckCommand(d, c))}">copy command</button><a class="dl" href="${base}${c.file.split("/").map(encodeURIComponent).join("/")}" download>download</a></td></tr>`).join("") + `</table>`
    : `<div style="color:var(--muted)">no checkpoints saved</div>`;
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const t = b.textContent;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "copied"; } catch (e) { b.textContent = "select it"; }
    setTimeout(() => b.textContent = t, 1500);
  });
}

// ---- notes, lineage, launch ---------------------------------------------------------------------
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function parentShort(p) { return p.kind === "bc" ? `BC ${p.policy || p.name}` : p.name; }
function parentText(p) {
  if (p.kind === "run") return `run ${p.name}` + (p.steps != null ? ` at ${fmt(p.steps, 0)} steps` : "");
  if (p.kind === "bc") return `behavior cloning of ${p.policy || "?"} on ${p.task || "?"} (runs/bc/${p.name})`;
  return p.name;
}
const go = n => `<a class="go" data-go="${esc(n)}">${esc(n)}</a>`;
const goSweep = g => `<a class="go" data-gosweep="${esc(g)}">${esc(g)}</a>`;
function bindGo(root) {
  root.querySelectorAll("[data-go]").forEach(a => a.onclick = () => openRun(a.dataset.go));
  root.querySelectorAll("[data-gosweep]").forEach(a => a.onclick = () => openSweep(a.dataset.gosweep));
}
// a run's few words above its notes (summary.txt): what it changed, the subtitle of its box in the lineage
const SUMMARY_FIELD = `<input id="runsummary" maxlength="120" placeholder="what it changes, in a few words (summary.txt: its box in the lineage)">`;
// the notes box of a run's page (default) or a sweep's (url, onSaved); a run's has its summary above
function setupNotes(info, url, onSaved) {
  const box = document.getElementById("notes"), st = document.getElementById("notestate"), sum = document.getElementById("runsummary");
  box.value = info.notes || ""; ui.notesDirty = false; st.textContent = "";
  const name = info.name;
  let said = info.title || "";
  if (sum) sum.value = said;
  const save = async () => {
    st.textContent = "saving…";
    try {
      const r = await fetch(url || "/api/runs/" + encodeURIComponent(name) + "/notes", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notes: box.value }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      if (sum && sum.value.trim() !== said) {  // (its few words: only when they changed)
        const q = await fetch("/api/runs/" + encodeURIComponent(name) + "/summary", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ summary: sum.value }) });
        if (!q.ok) throw new Error((await q.json()).error || q.status);
        said = sum.value.trim();
        if (state.data[name]) state.data[name].info.title = said;
        const run = state.runs.find(r => r.name === name); if (run) run.title = said;
      }
      ui.notesDirty = false; st.textContent = "saved";
      if (onSaved) onSaved();
      else {
        if (state.data[name]) state.data[name].info.notes = box.value;
        const run = state.runs.find(r => r.name === name); if (run) run.notes = box.value;
      }
      renderRuns();
    } catch (e) { st.textContent = "not saved: " + e.message; }
  };
  box.oninput = () => { ui.notesDirty = true; st.textContent = "unsaved"; };
  box.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } };
  if (sum) { sum.oninput = box.oninput; sum.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); } }; }
  document.getElementById("savenotes").onclick = save;
}
function renderLineage(d) {
  const info = d.info, p = info.parent, rows = [];
  if (info.kind === "match" && info.players) {  // who played: links to their runs
    const link = pl => { const run = pl.name.split("@")[0];
      return state.runs.some(r => r.name === run) ? `${go(run)}${pl.name.includes("@") ? " @ " + esc(pl.name.split("@")[1]) : ""}` : esc(pl.name); };
    rows.push(["Player A", link(info.players.A)], ["Player B", link(info.players.B)],
              ["Sides", "swapped every episode; outcomes are A's"], ["Task", esc(info.task)]);
    const el = document.getElementById("lineage");
    el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    bindGo(el);
    return;
  }
  if (!p) rows.push(["Started from", "scratch (random weights)"]);
  else if (p.kind === "run") rows.push(["Started from", `${go(p.name)}${p.steps != null ? ` at ${fmt(p.steps, 0)} steps` : ""}`]);
  else if (p.kind === "bc") rows.push(["Started from", `behavior cloning of <b>${esc(p.policy || "?")}</b> on ${esc(p.task || "?")}` +
    (p.episodes ? ` (${fmt(p.episodes, 0)} episodes; the script wins ${(100 * (p.win_rate || 0)).toFixed(0)}%)` : "") +
    ` · ${go("bc/" + p.name)}`]);
  else rows.push(["Started from", esc(p.name)]);
  // the chain back: parents of parents (runs known to the list)
  const chain = []; let q = p, seen = new Set([info.name]);
  while (q && q.kind === "run" && !seen.has(q.name)) {
    seen.add(q.name); const r = state.runs.find(r => r.name === q.name); if (!r) break;
    q = r.parent; if (q) chain.push(q.kind === "run" ? go(q.name) : esc(parentShort(q)));
  }
  if (chain.length) rows.push(["Before that", chain.join(" ← ")]);
  if (info.sweep) {
    const sib = [];
    for (let k = 1; k <= info.sweep.of; k++) { const n = `${info.sweep.group}-${k}`; sib.push(n === info.name ? `<b>${k}</b>` : `<a class="go" data-go="${esc(n)}">${k}</a>`); }
    const g = state.sweeps.find(x => x.group === info.sweep.group);
    const about = g && g.notes && g.notes.trim() ? `<br><span style="color:var(--muted)">${esc(g.notes.trim().split("\n")[0])}</span>` : "";
    rows.push(["Sweep", `${goSweep(info.sweep.group)} ${info.sweep.index}/${info.sweep.of}: <code>${esc(info.sweep.options || "base options")}</code> · runs ${sib.join(" ")}${about}`]);
  }
  rows.push(["Continued by", info.children && info.children.length ? info.children.map(go).join(", ") : "–"]);
  rows.push(["Task", esc(info.task)]);
  const el = document.getElementById("lineage");
  el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  bindGo(el);
}
function renderLaunch(info) { renderLaunchInto(document.getElementById("launch"), info.launch || {}, info, false); }
// launch commands, code version and (for a run) its configuration; a sweep's page shows its launch
function renderLaunchInto(el, l, info, sweep) {
  const a = (info && (info.args || info.config)) || {}, parts = [];  // (whole-game runs: config)
  const cmdBlock = (title, text) => `<div class="cmdhead"><span>${title}</span><button class="copy" data-copy="${esc(text)}">copy</button></div><pre class="cmd">${esc(text)}</pre>`;
  if (sweep) {
    if (l.command) parts.push(cmdBlock(l.rebuilt ? "Equivalent command (rebuilt from its runs' options: the sweep predates recorded launches)"
                                                 : "Launched with", l.command));
  } else {
    if (l.run_command) parts.push(cmdBlock(l.rebuilt ? "Equivalent command (rebuilt from the recorded options: this run predates recorded launches)"
                                                     : "This run on its own", l.run_command));
    if (l.command && l.command !== l.run_command) parts.push(cmdBlock(info.sweep ? "Launched with (the whole sweep)" : "Launched with", l.command));
  }
  const g = l.git || {};
  const facts = [];
  if (g.commit) facts.push(["Code", `<code>${esc(g.commit)}</code> ${esc(g.subject || "")}${g.dirty ? ` <span class="loss">(uncommitted changes)</span>` : ""}`]);
  if (l.host) facts.push(["Host", `${esc(l.host)} <span style="color:var(--muted)">${esc(l.cwd || "")}</span>`]);
  if (l.time) facts.push(["Launched", new Date(l.time * 1000).toLocaleString()]);
  if (facts.length) parts.push(`<dl class="facts" style="margin:4px 0 10px">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`);
  if (sweep) { finishLaunch(el, parts); return; }
  const defaulted = new Set((info.task_defaults_used || []).map(d => d.split("=")[0].replace(/^--/, "").replace(/-/g, "_")));
  const skip = new Set(["name", "note", "sweep"]);
  const kv = Object.entries(a).filter(([k, v]) => !skip.has(k) && v !== null && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<span class="${defaulted.has(k) ? "def" : ""}" title="${defaulted.has(k) ? "from the task's defaults" : ""}">${esc(k)} <b>${esc(v)}</b></span>`);
  const extra = (info.extra || []).filter(e => !e.startsWith("--base.load_model_path="))
    .map(e => { const [k, v] = e.replace(/^--/, "").split("="); return `<span class="${defaulted.has(k) ? "def" : ""}">${esc(k)} <b>${esc(v)}</b></span>`; });
  parts.push(`<div class="cmdhead"><span>Configuration${defaulted.size ? " (dashed: the task's defaults)" : ""}</span></div><div class="kv">${[...kv, ...extra].join("")}</div>`);
  if (info.command) parts.push(cmdBlock("Trainer command", info.command.join(" ")));
  finishLaunch(el, parts);
}
function finishLaunch(el, parts) {
  el.innerHTML = parts.join("");
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "copied"; }
    catch (e) { b.textContent = "select it"; }
    setTimeout(() => b.textContent = "copy", 1500);
  });
}

const slider = document.getElementById("smooth");
slider.value = ui.smooth; document.getElementById("smoothv").textContent = (+ui.smooth).toFixed(2);
slider.addEventListener("input", () => {
  ui.smooth = parseFloat(slider.value); document.getElementById("smoothv").textContent = ui.smooth.toFixed(2);
  try { localStorage.setItem("smooth", ui.smooth); } catch (e) {}
  for (const id in ui.charts) drawChart(id);
});
setupRunTools();
document.getElementById("nav-docs").onclick = () => openDocs(state.view === "docs" ? null : undefined);
document.getElementById("nav-runs").onclick = () => { if (["docs", "lineage", "ratings", "videos"].includes(state.view)) openRun(state.selected || (state.runs[0] || {}).name); };
document.getElementById("nav-videos").onclick = () => openVideos();
document.getElementById("nav-lineage").onclick = () => openLineage();
document.getElementById("nav-ratings").onclick = () => openRatings();
document.getElementById("nav-challenge").onclick = () => openChallenge();
if (state.view === "docs") openDocs(parseUrl().name || undefined);
else if (state.view === "ratings") openRatings();
else if (state.view === "videos") openVideos(parseUrl().q.get("q") || undefined);
else if (state.view === "lineage") openLineage(parseUrl().q.get("track") === "micro" ? "micro" : "whole game");
else saveUrl(false);  // (an old #… link: its address in the new form)
// back and forward: show the page of that history entry
window.addEventListener("popstate", async () => {
  const u = parseUrl();
  navigating = true;
  try {
    if (u.view === "docs") { ui.docs.editing = false; await openDocs(u.name || undefined); }
    else if (u.view === "lineage") await openLineage(u.q.get("track") === "micro" ? "micro" : "whole game");
    else if (u.view === "ratings") await openRatings();
    else if (u.view === "videos") await openVideos(u.q.get("q") || "");
    else {
      const t = u.q.get("tab");
      if (t) ui.tabs.run = ui.tabs.bc = ui.tabs.collect = ui.tabs.fullbc = t; else ui.tabs.run = ui.tabs.bc = ui.tabs.collect = ui.tabs.fullbc = "overview";
      if (u.view === "sweep") { state.view = "sweep"; state.sweep = u.name; setNav(); selectionChanged(); }
      else {
        const name = u.name || state.selected;
        const same = state.view === "run" && name === state.selected;
        state.view = "run"; state.selected = name; setNav();
        if (same && document.querySelector(".tabs")) showTab(runTabKind(), ui.tabs[runTabKind()] || "overview", true);
        else { state.mediaKey = ""; selectionChanged(); }
      }
    }
  } finally { navigating = false; }
});
refresh().then(showSelectedRun);
// a phone's run list: ☰ opens it, a tap beside it closes it
document.getElementById("menu").onclick = () => document.body.classList.toggle("drawer");
document.body.addEventListener("click", ev => { if (ev.target === document.body) document.body.classList.remove("drawer"); });
// every 5 s while the page is looked at (a phone's hidden tab asks nothing); at once when it is again
setInterval(() => { if (document.getElementById("auto").checked && !document.hidden) refresh(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && document.getElementById("auto").checked) refresh(); });
window.addEventListener("resize", () => { for (const id in ui.charts) drawChart(id); });
