  document.getElementById("matrix").innerHTML = matrixHtml(d.matrix, "How often the row's race won against the column's (built-in AI against built-in AI; the number of games under it)");
  const rec = d.recent || [];
  document.getElementById("recent").innerHTML = rec.length ? `<table class="runs"><tr><th>game</th><th>races</th><th>difficulty</th><th>winner</th><th>minutes</th><th>orders</th><th>wall s</th><th>finished</th></tr>` +
    rec.map(r => `<tr><td>${r.game}</td><td>${esc((r.races || []).join(" vs "))}</td><td>${esc((r.difficulties || []).join(" / "))}</td>
      <td>${r.winner == null ? "tie" : esc((r.races || [])[r.winner] || r.winner)}</td><td>${fmt(r.minutes, 1)}</td><td>${fmt(r.orders || 0, 0)}</td><td>${r.seconds != null ? fmt(r.seconds, 0) : "–"}</td><td>${ago(r.time)}</td></tr>`).join("") + `</table>`
    : `<div style="color:var(--muted)">no games yet</div>`;
  const cmd = info.command;
  finishLaunch(document.getElementById("launch"), cmd ? [`<div class="cmdhead"><span>Collected with</span><button class="copy" data-copy="${esc(cmd)}">copy</button></div><pre class="cmd">${esc(cmd)}</pre>`]
    : [`<div style="color:var(--muted)">not recorded</div>`]);
}

// ---- a whole-game behavior cloning fit (runs/bc/<name>, task fullgame; fullgame/bc.py, play.py) ----
function renderFullBC(d) {
  const info = d.info, fit = d.fit || [], last = fit[fit.length - 1] || {}, plays = d.plays || [], main = document.getElementById("main");
  const F = (key, name, color) => [key, name, color];
  const noFit = (info.status || "").startsWith("fitting") ? "fitting: the first epoch is on its way" : "no epochs recorded";
  const charts = [
    ["f-loss", "Loss", "order + target + ½ point", [F("train_loss", "train", "#e0a33a"), F("val_loss", "validation", "#539bf5")]],
    ["f-parts", "Validation loss parts", "cross-entropy", [F("val.loss_order", "order", "#4cc38a"), F("val.loss_target", "target unit", "#e5534b"), F("val.loss_point", "point (x + y)", "#b083f0")]],
    ["f-acc", "Accuracy (validation)", "the most likely choice is the AI's", [F("val.order_acc", "order (given one)", "#4cc38a"), F("val.target_acc", "target unit", "#e5534b"), F("train.order_acc", "order, train", "#8795a3")], { ymin: 0, ymax: 1 }],
    ["f-rate", "Orders per unit and step", "predicted chance vs the AI's rate", [F("val.order_rate_pred", "predicted", "#539bf5"), F("val.orders_per_unit_step", "the AI", "#e0a33a")], { ymin: 0 }],
    ["f-pt", "Point error", "bins off (x and y, 48 world units each)", [F("val.point_error_bins", "validation", "#b083f0"), F("train.point_error_bins", "train", "#8795a3")], { ymin: 0 }],
  ];
  const playCharts = [
    ["p-win", "Wins against the built-in AI", "per evaluation", [["win_rate", "wins", "#4cc38a"], ["tie_rate", "ties", "#e0a33a"]], { ymin: 0, ymax: 1 }],
    ["p-gold", "Gold mined per game", "the clone vs the AI", [["gold", "clone", "#4cc38a"], ["ai_gold", "built-in AI", "#e5534b"]], { ymin: 0 }],
    ["p-ref", "Refused orders", "share the game did not accept", [["refused", "refused", "#e5534b"]], { ymin: 0, ymax: 1 }],
  ];
  if (main.dataset.run !== info.name) {
    main.dataset.run = info.name; ui.charts = {};
    main.innerHTML = `<div class="title"><h2>${esc(info.name)}</h2><span class="badge bc">BC</span>${badge(info.status)}<span class="desc">${esc(info.description || "")}</span></div>` +
      tabsHtml("fullbc", [
        ["overview", "Overview", overviewHtml(info, `what this fit is for (runs/bc/${info.dataset}/notes.md)`)],
        ["fit", "Fit", `<div style="color:var(--muted);margin-bottom:8px">per epoch; validation: held-out games</div><div class="grid">${charts.map(chartBox).join("")}</div>`, true],
        ["play", "Play", `<div style="color:var(--muted);margin-bottom:8px">fullgame/play.py: the clone playing the built-in AI (every row: one launch)</div><div id="plays"></div>
          <div class="grid" style="margin-top:12px">${playCharts.map(chartBox).join("")}</div><div id="playmatrix" style="margin-top:12px"></div>`, true],
        ["children", "Runs from it", `<div id="bcchildren"></div>`],
        ["launch", "Command", `<div id="launch"></div>`],
      ]);
    for (const [id, , , , opts] of [...charts, ...playCharts]) registerChart(id, { axis: id.startsWith("p-") ? "eval" : "epoch", empty: id.startsWith("p-") ? "no evaluations yet" : noFit, raw: true, ...(opts || {}) });
    setupNotes(info);
    setupTabs("fullbc");
  } else if (!ui.notesDirty && document.activeElement !== document.getElementById("notes")) {
    document.getElementById("notes").value = info.notes || "";
  }
  const pct = v => v == null ? "–" : (100 * v).toFixed(0) + "%";
  const games = info.games || {}, voc = info.vocab || {}, lp = plays[plays.length - 1];
  const best = fit.reduce((b, r) => (r.val_loss != null && (!b || r.val_loss < b.val_loss)) ? r : b, null);
  document.getElementById("cards").innerHTML = [
    ["Status", esc(info.status || "")],
    ["Games", `${fmt(games.train || 0, 0)} <small>train · ${fmt(games.val || 0, 0)} validation</small>`],
    ["Epochs", fit.length ? `${last.epoch}${info.args && info.args.epochs ? ` <small>/ ${esc(info.args.epochs)} · ${fmt(last.seconds || 0, 0)} s</small>` : ""}` : "–"],
    ["Best epoch", best ? `${best.epoch} <small>validation loss ${fmt(best.val_loss, 3)}</small>` : "–"],
    ["Order accuracy", best && best.val ? `${pct(best.val.order_acc)} <small>given an order · target ${pct(best.val.target_acc)}</small>` : "–"],
    ["Against the AI", lp ? `${pct(lp.win_rate)} <small>${lp.wins}–${lp.ties}–${lp.losses} (${esc(lp.difficulty || "")})</small>` : "–"],
    ["Runs from it", `${(info.children || []).length}`],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const a = info.args || {};
  const rows = [["Demonstrations", (info.datasets || []).length ? info.datasets.map(go).join(", ") : esc(info.data || "–")],
    ["Vocabulary", `${voc.types || "?"} unit types · ${voc.orders || "?"} order classes · ${voc.upgrades || "?"} upgrades`],
    ["Network", `transformer, d ${esc(a.d || "?")}, ${esc(a.layers || "?")} layers, dropout ${esc(a.dropout || "?")}`],
    ["Training", `lr ${esc(a.lr || "?")}, batch ${esc(a.batch || "?")}; the epoch with the lowest validation loss is policy.pt`],
    ["Started", info.created ? new Date(info.created * 1000).toLocaleString() : "–"]];
  const lin = document.getElementById("lineage");
  lin.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  bindGo(lin);
  ui.xranges = { epoch: [1, Math.max(2, fit.length ? last.epoch : 2)], eval: [1, Math.max(2, plays.length)] };
  setCharts(charts, (id, key) => fitPoints(d, key));
  const pts = plays.map((p, i) => ({ ...p, steps: i + 1, tie_rate: p.ties / p.games }));
  setCharts(playCharts, (id, key) => pts.map(p => [p.steps, p[key]]));
  document.getElementById("plays").innerHTML = plays.length ? `<table class="runs"><tr><th>#</th><th>evaluation</th><th>games</th><th>win–tie–loss</th><th>wins</th><th>minutes</th><th>gold (clone / AI)</th><th>orders per game</th><th>refused</th><th>by race (wins)</th><th>when</th></tr>` +
    plays.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.label)}</td><td>${p.games}</td><td>${p.wins}–${p.ties}–${p.losses}</td><td>${pct(p.win_rate)}</td><td>${fmt(p.minutes, 1)}</td>
      <td>${fmt(p.gold, 0)} / ${fmt(p.ai_gold, 0)}</td><td>${fmt(p.orders, 0)}</td><td>${pct(p.refused)}</td>
      <td>${Object.entries(p.by_race || {}).map(([r, [w, t, l]]) => `${esc(r)} ${w}/${w + t + l}`).join(" · ")}</td><td>${ago(p.time)}</td></tr>`).join("") + `</table>`
    : `<div style="color:var(--muted)">not evaluated yet: <code>python3 -m warcraftsim.fullgame.play runs/bc/${esc(info.dataset)}/policy.pt</code></div>`;
  if (lp) {
    const m = {}; for (const r of RACES) { m[r] = {}; for (const o of RACES) m[r][o] = ((lp.matrix || {})[r] || {})[o] || [0, 0, 0]; }
    document.getElementById("playmatrix").innerHTML = matrixHtml(m, `The latest evaluation by matchup: the clone's race (rows) against the AI's (columns)`);
  } else document.getElementById("playmatrix").innerHTML = "";
  const kids = (info.children || []).map(n => state.runs.find(r => r.name === n)).filter(Boolean);
  setTabCount("children", kids.length, true);
  const ch = document.getElementById("bcchildren");
  ch.innerHTML = kids.length ? `<table class="runs"><tr><th>run</th><th>task</th><th>status</th><th>steps</th><th>win (last 100)</th></tr>` +
    kids.map(r => `<tr><td>${go(r.name)}</td><td>${esc(r.task)}</td><td>${badge(r.status)}</td><td>${fmt((r.summary || {}).agent_steps || 0, 0)}</td><td>${winText(r.summary)}</td></tr>`).join("") + `</table>`
    : `<div style="color:var(--muted)">none yet</div>`;
  bindGo(ch);
  const cmd = info.command || `python3 -m warcraftsim.fullgame.bc ` + Object.entries(a).filter(([k, v]) => v !== "" && v !== "None" && v !== "False" && k !== "runs" && k !== "device")
    .map(([k, v]) => `--${k.replace(/_/g, "-")} ${String(v).replace(/^\[|\]$/g, "").replace(/PosixPath\('([^']*)'\)/g, "$1").replace(/,/g, "")}`).join(" ");
  finishLaunch(document.getElementById("launch"), [`<div class="cmdhead"><span>Fitted with${info.command ? "" : " (rebuilt from its settings)"}</span><button class="copy" data-copy="${esc(cmd)}">copy</button></div><pre class="cmd">${esc(cmd)}</pre>`]);
}

// ---- notes, lineage, launch ---------------------------------------------------------------------
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function parentShort(p) { return p.kind === "bc" ? `BC ${p.policy || p.name}` : p.name; }
function parentText(p) {
  if (p.kind === "run") return `run ${p.name}` + (p.steps != null ? ` at ${fmt(p.steps, 0)} steps` : "");
  if (p.kind === "bc") return `behavior cloning of ${p.policy || "?"} on ${p.task || "?"} (runs/bc/${p.name})`;
  return p.name;
}
const go = n => `<a class="go" data-go="${esc(n)}">${esc(n)}</a>`;
const goSweep = g => `<a class="go" data-gosweep="${esc(g)}">${esc(g)}</a>`;
function bindGo(root) {
  root.querySelectorAll("[data-go]").forEach(a => a.onclick = () => openRun(a.dataset.go));
  root.querySelectorAll("[data-gosweep]").forEach(a => a.onclick = () => openSweep(a.dataset.gosweep));
}
// the notes box of a run's page (default) or a sweep's (url, onSaved)
function setupNotes(info, url, onSaved) {
  const box = document.getElementById("notes"), st = document.getElementById("notestate");
  box.value = info.notes || ""; ui.notesDirty = false; st.textContent = "";
  const name = info.name;
  const save = async () => {
    st.textContent = "saving…";
    try {
      const r = await fetch(url || "/api/runs/" + encodeURIComponent(name) + "/notes", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notes: box.value }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      ui.notesDirty = false; st.textContent = "saved";
      if (onSaved) onSaved();
      else {
        if (state.data[name]) state.data[name].info.notes = box.value;
        const run = state.runs.find(r => r.name === name); if (run) run.notes = box.value;
      }
      renderRuns();
    } catch (e) { st.textContent = "not saved: " + e.message; }
  };
  box.oninput = () => { ui.notesDirty = true; st.textContent = "unsaved"; };
  box.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } };
  document.getElementById("savenotes").onclick = save;
}
function renderLineage(d) {
  const info = d.info, p = info.parent, rows = [];
  if (info.kind === "match" && info.players) {  // who played: links to their runs
    const link = pl => { const run = pl.name.split("@")[0];
      return state.runs.some(r => r.name === run) ? `${go(run)}${pl.name.includes("@") ? " @ " + esc(pl.name.split("@")[1]) : ""}` : esc(pl.name); };
    rows.push(["Player A", link(info.players.A)], ["Player B", link(info.players.B)],
              ["Sides", "swapped every episode; outcomes are A's"], ["Task", esc(info.task)]);
    const el = document.getElementById("lineage");
    el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    bindGo(el);
    return;
  }
  if (!p) rows.push(["Started from", "scratch (random weights)"]);
  else if (p.kind === "run") rows.push(["Started from", `${go(p.name)}${p.steps != null ? ` at ${fmt(p.steps, 0)} steps` : ""}`]);
  else if (p.kind === "bc") rows.push(["Started from", `behavior cloning of <b>${esc(p.policy || "?")}</b> on ${esc(p.task || "?")}` +
    (p.episodes ? ` (${fmt(p.episodes, 0)} episodes; the script wins ${(100 * (p.win_rate || 0)).toFixed(0)}%)` : "") +
    ` · ${go("bc/" + p.name)}`]);
  else rows.push(["Started from", esc(p.name)]);
  // the chain back: parents of parents (runs known to the list)
  const chain = []; let q = p, seen = new Set([info.name]);
  while (q && q.kind === "run" && !seen.has(q.name)) {
    seen.add(q.name); const r = state.runs.find(r => r.name === q.name); if (!r) break;
    q = r.parent; if (q) chain.push(q.kind === "run" ? go(q.name) : esc(parentShort(q)));
  }
  if (chain.length) rows.push(["Before that", chain.join(" ← ")]);
  if (info.sweep) {
    const sib = [];
    for (let k = 1; k <= info.sweep.of; k++) { const n = `${info.sweep.group}-${k}`; sib.push(n === info.name ? `<b>${k}</b>` : `<a class="go" data-go="${esc(n)}">${k}</a>`); }
    const g = state.sweeps.find(x => x.group === info.sweep.group);
    const about = g && g.notes && g.notes.trim() ? `<br><span style="color:var(--muted)">${esc(g.notes.trim().split("\n")[0])}</span>` : "";
    rows.push(["Sweep", `${goSweep(info.sweep.group)} ${info.sweep.index}/${info.sweep.of}: <code>${esc(info.sweep.options || "base options")}</code> · runs ${sib.join(" ")}${about}`]);
  }
  rows.push(["Continued by", info.children && info.children.length ? info.children.map(go).join(", ") : "–"]);
  rows.push(["Task", esc(info.task)]);
  const el = document.getElementById("lineage");
  el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  bindGo(el);
}
function renderLaunch(info) { renderLaunchInto(document.getElementById("launch"), info.launch || {}, info, false); }
// launch commands, code version and (for a run) its configuration; a sweep's page shows its launch
function renderLaunchInto(el, l, info, sweep) {
  const a = (info && info.args) || {}, parts = [];
  const cmdBlock = (title, text) => `<div class="cmdhead"><span>${title}</span><button class="copy" data-copy="${esc(text)}">copy</button></div><pre class="cmd">${esc(text)}</pre>`;
  if (sweep) {
    if (l.command) parts.push(cmdBlock(l.rebuilt ? "Equivalent command (rebuilt from its runs' options: the sweep predates recorded launches)"
                                                 : "Launched with", l.command));
  } else {
    if (l.run_command) parts.push(cmdBlock(l.rebuilt ? "Equivalent command (rebuilt from the recorded options: this run predates recorded launches)"
                                                     : "This run on its own", l.run_command));
    if (l.command && l.command !== l.run_command) parts.push(cmdBlock(info.sweep ? "Launched with (the whole sweep)" : "Launched with", l.command));
  }
  const g = l.git || {};
  const facts = [];
  if (g.commit) facts.push(["Code", `<code>${esc(g.commit)}</code> ${esc(g.subject || "")}${g.dirty ? ` <span class="loss">(uncommitted changes)</span>` : ""}`]);
  if (l.host) facts.push(["Host", `${esc(l.host)} <span style="color:var(--muted)">${esc(l.cwd || "")}</span>`]);
  if (l.time) facts.push(["Launched", new Date(l.time * 1000).toLocaleString()]);
  if (facts.length) parts.push(`<dl class="facts" style="margin:4px 0 10px">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`);
  if (sweep) { finishLaunch(el, parts); return; }
  const defaulted = new Set((info.task_defaults_used || []).map(d => d.split("=")[0].replace(/^--/, "").replace(/-/g, "_")));
  const skip = new Set(["name", "note", "sweep"]);
  const kv = Object.entries(a).filter(([k, v]) => !skip.has(k) && v !== null && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<span class="${defaulted.has(k) ? "def" : ""}" title="${defaulted.has(k) ? "from the task's defaults" : ""}">${esc(k)} <b>${esc(v)}</b></span>`);
  const extra = (info.extra || []).filter(e => !e.startsWith("--base.load_model_path="))
    .map(e => { const [k, v] = e.replace(/^--/, "").split("="); return `<span class="${defaulted.has(k) ? "def" : ""}">${esc(k)} <b>${esc(v)}</b></span>`; });
  parts.push(`<div class="cmdhead"><span>Configuration${defaulted.size ? " (dashed: the task's defaults)" : ""}</span></div><div class="kv">${[...kv, ...extra].join("")}</div>`);
  if (info.command) parts.push(cmdBlock("Trainer command", info.command.join(" ")));
  finishLaunch(el, parts);
}
function finishLaunch(el, parts) {
  el.innerHTML = parts.join("");
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "copied"; }
    catch (e) { b.textContent = "select it"; }
    setTimeout(() => b.textContent = "copy", 1500);
  });
}

const slider = document.getElementById("smooth");
slider.value = ui.smooth; document.getElementById("smoothv").textContent = (+ui.smooth).toFixed(2);
slider.addEventListener("input", () => {
  ui.smooth = parseFloat(slider.value); document.getElementById("smoothv").textContent = ui.smooth.toFixed(2);
  try { localStorage.setItem("smooth", ui.smooth); } catch (e) {}
  for (const id in ui.charts) drawChart(id);
});
setupRunTools();
refresh().then(showSelectedRun);
setInterval(() => { if (document.getElementById("auto").checked) refresh(); }, 5000);
window.addEventListener("resize", () => { for (const id in ui.charts) drawChart(id); });
</script>
